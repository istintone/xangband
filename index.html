/* cmd.js — コマンド解決とゲーム進行。DOM 非依存 ([[D-28]])。
 *
 * ここがヘッドレスでも動くので、受け入れ基準の自動プレイを測れる。
 *
 * 不変条件4 (docs/01 §1.5): エネルギーを消費しない行動を作らない。
 * メタ操作(インベントリ閲覧など)は明確に分ける。
 */
'use strict';

var Cmd = (function () {

  /* ---------- 階層の出入り ---------- */

  /**
   * 深度 depth へ移動する。depth 0 は母船《アンカー》([[D-39]])。
   */
  function enterLevel(W, depth, fromBelow) {
    // プレイヤー以外を捨てる (階層は非永続 — docs/02 §2.3)
    W.actors = W.actors.filter(function (a) { return a.kind === 'player'; });
    W.items = [];
    W.depth = depth;

    if (depth === 0) {
      W.level = Hub.createLevel();
      W.level.env = Env.create(null);          // 母船は標準環境
      Signature.initSurveillance(W);           // 補足は階を移ると切れる
      Target.clear(W);
      W.player.x = W.level.down.x;
      W.player.y = W.level.down.y - 1;
      Hub.restock(W, !W.shops);
      W.feeling = { danger: 0, loot: 0, lootKnown: true };
      W.player.cog = W.player.cogMax;            // 母船では認知が全快する
      World.msg(W, '母船《アンカー》。');
      if (W.returning && !W.won) win(W);          // 帰還して初めて勝利 (§7.5)
      refreshView(W);
      return;
    }

    // サイトが未設定なら最初のサイトに入る(セーブ互換のため)
    if (!W.site) W.site = Site.starting()[0] || Site.all()[0];

    var lrng = W.rng.derive(W.site.id + '/L' + depth + '#' + W.turn);
    var env = Env.create(W.site.env);
    var lv, fixedMarks = null;

    /* 《起源》だけは部分的に固定する (docs/02 §2.3 の例外 / docs/07 §7.4)。
       98 で静かにさせることが 99・100 の重さを作る。 */
    var fixed = W.site.id === 'origin' ? Origin.fixedFor(depth) : null;
    if (fixed) {
      var built = Origin.buildFixed(lrng, fixed, env, W);
      lv = built.level;
      fixedMarks = built.marks;
    } else {
      var plan = W.site.id === 'origin' ? Origin.genFor(lrng, depth) : null;
      lv = Gen.generate(lrng, depth, plan ? plan.opts : Site.genOpts(W.site));
      lv.env = env;
      // 接続層は階ごとに別のサイトの顔をしている。地形で「同じものだった」ことを示す
      if (plan && plan.lookSite) lv.lookSite = plan.lookSite.id;
    }
    lv.site = W.site.id;
    W.level = lv;
    /* 補足は階を移ると切れる。alerted だけ消して alertLevel を残すと、
       次の階で即座に最大警戒から始まり、尖塔から二度と抜けられない。 */
    Signature.initSurveillance(W);
    Target.clear(W);

    /* 固定階には片方の階段しか無いことがある(《門番》の降下シャフトは
       倒すまで開かない)。無い側から入ろうとしても落ちないようにする。 */
    var start = (fromBelow ? lv.down : lv.up) || lv.up || lv.down;
    if (!start) throw new Error('階に階段が無い: 深度 ' + depth);
    W.player.x = start.x;
    W.player.y = start.y;

    if (fixedMarks) {
      populateFixed(lrng, W, lv, fixedMarks);      // 固定階は中身も固定
    } else {
      Monster.populate(lrng, W, depth, W.site);
      Item.populate(lrng, W, depth);
      populateMarks(lrng, W, lv, depth);
    }

    if (depth > W.player.depthMax) W.player.depthMax = depth;
    Site.noteDepth(W, W.site.id, depth);
    Signature.onEnter(W);                        // サイト固有の機構を仕込む
    computeFeeling(W);
    refreshView(W);

    var envText = Env.describe(W);
    World.msg(W, W.site.name + ' 深度 ' + depth + '。' + feelingText(W) +
                 (envText ? ' ' + envText : ''));
    if (depth === W.site.depthMin && W.site.enterText) World.msg(W, W.site.enterText);

    // 《起源》は層ごとに一言を変える。深さの質が変わったことを告げる
    if (W.site.id === 'origin') {
      var ot = Origin.enterText(depth);
      if (ot) World.msg(W, ot);
    }
  }

  /**
   * 《起源》の固定階の中身を置く。
   * 通常の配置(敵・アイテム・区画テンプレート)は**一切走らせない**。
   * 静止層に敵が湧いたら、静止層である意味が無くなる。
   */
  function populateFixed(rng, W, lv, marks) {
    for (var i = 0; i < marks.length; i++) {
      var m = marks[i];
      if (m.kind === 'lore') {
        Fragment.place(rng, W, m.x, m.y, lv.depth);
      } else if (m.kind === 'warden' || m.kind === 'origin') {
        var id = m.kind === 'warden' ? 'u-warden' : 'u-origin';
        var race = Data.get().monstersById[id];
        if (!race) continue;
        var boss = Monster.spawn(rng, race, m.x, m.y);
        boss.unique = true;
        boss.asleep = 0;                        // 待っている。眠ってはいない
        World.addActor(W, boss);
        if (m.kind === 'warden') W.wardenAt = { x: m.x, y: m.y };
      }
    }
  }

  /**
   * 区画テンプレート / Vault の中身を配置する (docs/02 §2.4)。
   * 生成器は「どこに置くか」だけを記録しているので、ここで実体を作る。
   */
  function populateMarks(rng, W, lv, depth) {
    var marks = lv.marks || [];
    for (var i = 0; i < marks.length; i++) {
      var m = marks[i];
      // Vault の中身は深度+10(小) / +20(大) で抽選する。明確に格上が出る。
      var boost = m.vault ? (m.size === 'great' ? 20 : 10) : 0;
      var d = depth + boost;

      if (m.kind === 'item') Item.placeAt(rng, W, m.x, m.y, depth);
      else if (m.kind === 'goodItem') Item.placeAt(rng, W, m.x, m.y, d);
      else if (m.kind === 'monster') Monster.placeAt(rng, W, m.x, m.y, depth);
      else if (m.kind === 'toughMonster') Monster.placeAt(rng, W, m.x, m.y, d);
    }
  }

  /* ---------- 階の予感 (docs/02 §2.3) ---------- */

  function computeFeeling(W) {
    var danger = 0, i;
    for (i = 0; i < W.actors.length; i++) {
      var a = W.actors[i];
      if (a.kind === 'player') continue;
      var race = Data.get().monstersById[a.raceId];
      if (!race) continue;
      danger += Math.max(0, race.depth - W.depth) + 1;
      if (a.unique) danger += 12;
    }

    var loot = 0;
    for (i = 0; i < W.items.length; i++) {
      var it = W.items[i];
      if (it.uniqueId) loot += 40;
      else if (it.egoId) loot += 8;
      loot += Math.min(10, Math.round((it.cost || 0) / 200));
    }

    /* 予感は敵の**数**を数える式なので、単体の格上を過小評価する。
       深度100 に《起源》が1体だけ居る階が「危険2」と出ていた。
       ユニークが居る階には下限を敷いて、量ではなく質を伝える。 */
    var floor = 0;
    for (i = 0; i < W.actors.length; i++) {
      var f = W.actors[i];
      if (!f.unique || f.dead) continue;
      floor = Math.max(floor, Monster.hasFlag(f, 'FINAL') ? 9 : 7);
    }

    W.feeling = {
      danger: Math.max(floor, scale(danger, [0, 8, 16, 26, 38, 52, 70, 95, 130])),
      loot: scale(loot, [0, 6, 14, 24, 36, 52, 72, 100, 140]),
      lootKnown: false                     // 有望度は歩いて初めて開示する(本家準拠)
    };
  }

  function scale(v, thresholds) {
    for (var i = thresholds.length - 1; i >= 0; i--) {
      if (v >= thresholds[i]) return i + 1;
    }
    return 0;
  }

  var DANGER_TEXT = [
    'ここには何もいない。', '静かだ。', '落ち着いている。', '何かの気配がある。',
    '嫌な感じがする。', '危険だ。', 'ひどく危険だ。', '死の匂いがする。',
    'ここは墓場だ。', '生きて帰れる気がしない。'
  ];
  var LOOT_TEXT = [
    '見るべきものは無さそうだ。', '目ぼしいものは無い。', '多少は拾えそうだ。',
    '何かありそうだ。', '期待できる。', '良いものがある。', '大物の気配がある。',
    '滅多にない収穫だ。', '伝説級の何かがある。', 'ここに全てがある。'
  ];

  function feelingText(W) {
    var s = DANGER_TEXT[U.clamp(W.feeling.danger, 0, 9)];
    if (W.feeling.lootKnown) s += ' ' + LOOT_TEXT[U.clamp(W.feeling.loot, 0, 9)];
    return s;
  }

  function refreshView(W) {
    var p = W.player;
    p.lightRadius = Inventory.lightRadius(p, W.inv);
    FOV.compute(W.level, p.x, p.y, p.lightRadius);
    AI.computeFlow(W);
    // 見えている敵を知識に加える
    for (var i = 0; i < W.actors.length; i++) {
      var a = W.actors[i];
      if (a.kind === 'player' || a.dead) continue;
      if (World.hasFlag(W.level, a.x, a.y, World.F.VISIBLE)) Lore.noteSeen(W, a);
    }
  }

  /** 装備と状態から派生する値を再計算する。装備変更のたびに呼ぶ。 */
  function recalc(W) {
    var p = W.player;
    var bonus = Inventory.equipBonus(W.inv);
    p.equipBonus = bonus;

    var env = Env.envOf(W);

    p.statBonus = bonus.stats;
    p.ac = Inventory.totalAC(W.inv) + Stat.hitBonus(Stat.effective(p, 'dex')) +
           (p.mutationAC || 0);
    p.seal = Inventory.totalSeal(W.inv) + bonus.seal +
             (Player.hasFlag(p, 'SEAL_INNATE') ? 2 : 0);
    // 重力が速度に効く。低重力は速く、高重力は遅い (docs/08 §8.3)。
    p.speed = Turn.NORMAL_SPEED + Inventory.speedPenalty(p, W.inv, env) + bonus.speed +
              Env.speedMod(env);
    p.lightRadius = Inventory.lightRadius(p, W.inv);
    p.spMax = Ability.maxSP(p);
    if (p.sp > p.spMax) p.sp = p.spMax;
    p.cogMax = Player.maxCog(p);
    if (p.cog > p.cogMax) p.cog = p.cogMax;
    Player.recalcSkills(p);

    // 系統の固有耐性
    if (Player.hasFlag(p, 'NO_POISON')) bonus.resist.pois = true;
    if (Player.hasFlag(p, 'NO_RAD')) bonus.resist.rad = true;
    if (Player.hasFlag(p, 'TAINT_RESIST')) bonus.resist.pois = true;
  }

  /* ---------- プレイヤーの行動 ---------- */

  function move(W, dx, dy) {
    var p = W.player;
    if (dx === 0 && dy === 0) return true;      // その場で待つ

    // 混乱中は方向がランダムになる (docs/02 §2.7)
    if (p.timers.confused > 0 && W.rng.oneIn(2)) {
      var d = W.rng.pick(U.DIRS);
      dx = d.dx; dy = d.dy;
    }

    var nx = p.x + dx, ny = p.y + dy;
    var foe = World.actorAt(W, nx, ny);
    if (foe && foe.kind === 'monster') return attack(W, foe);

    if (!World.walkable(W.level, nx, ny)) {
      World.msg(W, '構造材に阻まれた。');
      return false;                              // 壁への移動はターンを消費しない
    }

    /* 扉を通ると気圧が均される (方舟のみ — [[D-47]])。
       敵は扉を開けないので、**気圧を操作できるのはプレイヤーだけ**。
       「開けるか」がこのサイトの一手を決める (docs/10 §10.2)。 */
    if (World.getTile(W.level, nx, ny) === World.TILE.DOOR && W.level.pressure) {
      Signature.equalize(W, nx, ny, p.x, p.y, nx + dx, ny + dy);
    }

    p.x = nx; p.y = ny;

    // 歩き始めると有望度が開示される (docs/02 §2.3)
    if (!W.feeling.lootKnown && W.depth > 0) {
      W.feeling.lootKnown = true;
      World.msg(W, LOOT_TEXT[U.clamp(W.feeling.loot, 0, 9)]);
    }

    if (World.getTile(W.level, nx, ny) === World.TILE.TRAP) triggerTrap(W);
    describeFloor(W);
    return true;
  }

  /* 設備障害 (docs/03 の読み替え表: Trap -> 設備障害)。 */
  var TRAPS = [
    { name: '破断配管', fx: function (W, p) { Actor.damage(p, W.rng.dice(2, 6)); World.msg(W, '蒸気が噴き出した。'); } },
    { name: '電磁トラップ', fx: function (W, p) {
        var lost = Math.min(p.cells, W.rng.range(20, 60));
        p.cells -= lost; World.msg(W, '電装が焼かれた。電力 -' + lost); } },
    { name: '自動砲座', fx: function (W, p) { Actor.damage(p, W.rng.dice(3, 5)); World.msg(W, '銃座が作動した。'); } },
    { name: '汚染散布', fx: function (W, p) {
        if (!Combat.resisted(p, 'pois')) { Actor.addTimer(p, 'poison', 12); World.msg(W, '汚染物質を浴びた。'); }
        else World.msg(W, '汚染物質を浴びたが、効かない。'); } },
    { name: '落とし穴', fx: function (W, p) {
        World.msg(W, '床が抜けた。');
        Actor.damage(p, W.rng.dice(2, 8));
        if (!W.dead && W.depth > 0) enterLevel(W, W.depth + 1, false); } }
  ];

  function triggerTrap(W) {
    var p = W.player;
    // 解錠技能で回避できる
    if (W.rng.int(100) < Math.min(75, p.skills.disarm / 2)) {
      World.msg(W, '設備障害を回避した。');
      World.setTile(W.level, p.x, p.y, World.TILE.FLOOR);
      return;
    }
    var t = W.rng.pick(TRAPS);
    World.msg(W, t.name + '!');
    W.lastAttacker = t.name;
    t.fx(W, p);
    World.setTile(W.level, p.x, p.y, World.TILE.FLOOR);
  }

  function describeFloor(W) {
    var p = W.player;
    var here = Item.itemsAt(W, p.x, p.y);
    if (here.length === 1) World.msg(W, Sigil.name(W.knowledge, here[0]) + 'が落ちている。');
    else if (here.length > 1) World.msg(W, here.length + '個のものが落ちている。');

    var t = World.getTile(W.level, p.x, p.y);
    if (t === World.TILE.DOWN) World.msg(W, W.depth === 0 ? '降下ポッド。> で降下する。' : '降下シャフト。> で降りる。');
    else if (t === World.TILE.UP && W.depth > 0) World.msg(W, '昇降機。< で戻る。');
    else if (t === World.TILE.SHOP) {
      var id = Hub.shopAt(W.level, p.x, p.y);
      var shop = Hub.shopById(id);
      World.msg(W, (shop ? shop.name : '格納庫') + '。Enter で入る。');
    }
  }

  function attack(W, foe) {
    var p = W.player;
    var weapon = Inventory.weapon(W.inv);
    var res = Combat.playerAttack(W, p, foe, weapon);

    if (res.hits === 0) {
      World.msg(W, foe.name + 'への攻撃を外した。');
    } else {
      var s = foe.name + 'に' + res.damage + 'のダメージ。';
      if (res.crits.length) s = res.crits[0] + '! ' + s;
      if (res.mult > 1) s = '効いている! ' + s;
      World.msg(W, s);
    }
    if (res.killed) onKill(W, foe);
    return true;
  }

  function onKill(W, foe) {
    World.msg(W, foe.name + 'を倒した。');
    Lore.noteKill(W, foe);
    if (foe.unique) {
      W.uniquesKilled[foe.raceId] = true;
      World.msg(W, foe.name + 'は二度と現れない。');
      grantAdaptationIfDeep(W, foe);
      // 《門番》を倒すと深度100 への道が開く。最初から開いていると素通りできる
      if (foe.raceId === 'u-warden') Origin.openWardenShaft(W);
      // 《起源》を倒した。ここから帰還フェーズ (docs/07 §7.5)
      if (Monster.hasFlag(foe, 'FINAL')) beginReturn(W);
    }
    var exp = Player.expFromKill(foe, W.player.level);
    if (Player.gainExp(W.player, exp) > 0) {
      World.msg(W, 'レベル ' + W.player.level + ' に上がった。');
    }
    dropLoot(W, foe);
    World.reapDead(W);
  }

  /**
   * サイト最深部のユニークを倒すと《適合》を得る (docs/07 §7.2)。
   * 集めるアイテムではなく、潜り切った結果として身体が変わる形にしている。
   */
  function grantAdaptationIfDeep(W, foe) {
    if (!W.site || !W.site.adaptation) return;
    /* **そのサイトの守護ユニークからのみ**得る ([[D-69]])。
       「最深部で倒したユニークなら何でも」だと、たまたま深部に流れてきた
       別のユニークで《適合》が手に入り、守護を置いた意味が消える。 */
    if (!foe || !foe.guardian) return;
    if (!Site.grantAdaptation(W, W.site.adaptation)) return;

    var name = Site.ADAPTATION_NAME[W.site.adaptation];
    World.msg(W, '身体が変わっていく ―― 《適合:' + name + '》を得た。');
    World.msg(W, 'この環境は、もうあなたを害さない。(' +
                 Site.adaptationCount(W) + '/4)');
    recalc(W);
  }

  function dropLoot(W, foe) {
    dropParts(W, foe);

    // ユニークは必ず良いものを落とす
    if (foe.unique) {
      var prize = Item.makeForDepth(W.rng, W.depth + 10, W);
      if (prize) { prize.x = foe.x; prize.y = foe.y; W.items.push(prize); Lore.noteDrop(W, foe); }
      var money = Item.makeForDepth(W.rng, W.depth, W);
      if (money) { money.x = foe.x; money.y = foe.y; W.items.push(money); }
      return;
    }
    var chance = foe.base === 'human' ? 2 : 5;
    if (!W.rng.oneIn(chance)) return;
    var it = Item.makeForDepth(W.rng, W.depth, W);
    if (!it) return;
    it.x = foe.x; it.y = foe.y;
    W.items.push(it);
    Lore.noteDrop(W, foe);
  }

  /**
   * 移植に要るレアパーツ (docs/11 §11.4)。
   * **深部の敵だけが落とす。** 供給過多にすると工房が最適解になり、
   * 「良い装備は拾うもの」という本家の性質が壊れる。
   * 所持品にも重量にも入らない ―― 素材の管理をゲームにしない。
   */
  function dropParts(W, foe) {
    if (W.depth < PARTS_MIN_DEPTH) return;
    var chance = foe.unique ? 1 : (foe.base === 'automata' ? 12 : 25);
    if (chance > 1 && !W.rng.oneIn(chance)) return;
    var n = foe.unique ? W.rng.range(2, 4) : 1;
    Craft.addParts(W, n);
    World.msg(W, 'レアパーツを ' + n + ' 個回収した。(所持 ' + Craft.parts(W) + ')');
  }

  var PARTS_MIN_DEPTH = 15;

  /** 遠隔攻撃 (docs/02 §2.6)。 */
  function shoot(W, target) {
    var p = W.player;
    var launcher = W.inv.equip.launcher;
    if (!launcher) { World.msg(W, '射出器を装備していない。'); return false; }

    var ammo = null;
    for (var i = 0; i < W.inv.items.length; i++) {
      var it = W.inv.items[i];
      if (it.base === 'ammo' && it.ammoType === launcher.ammo) { ammo = it; break; }
    }
    if (!ammo) { World.msg(W, '合う弾体が無い。'); return false; }

    // 指定した目標があればそれを狙う。無ければ最も近い敵 ([[D-49]])。
    var foe = target || Target.pick(W);
    if (!foe) { World.msg(W, '狙う相手がいない。'); return false; }
    if (U.distCheb(foe.x, foe.y, p.x, p.y) > Combat.rangeOf(launcher)) {
      World.msg(W, '射程外だ。');
      return false;
    }

    var res = Combat.rangedAttack(W, p, foe, launcher, ammo);
    if (res.hit) {
      var s = foe.name + 'に' + res.damage + 'のダメージ。';
      if (res.crits.length) s = res.crits[0] + '! ' + s;
      World.msg(W, s);
    } else {
      World.msg(W, '外れた。');
    }

    // 弾体は 1/4 で壊れる。壊れなければ床に落ちる。
    Inventory.consume(W.inv, ammo, 1);
    if (!W.rng.oneIn(4)) {
      var spent = Item.create(W.rng, Data.get().itemsById[ammo.kindId], 1);
      spent.x = foe.x; spent.y = foe.y;
      W.items.push(spent);
    } else {
      res.broke = true;
    }

    if (res.killed) onKill(W, foe);
    return true;
  }

  function useAbility(W, id) {
    // 減圧下では精神系・生体系が使えない (発声を伴う — docs/08 §8.4)
    var a = Data.get().abilitiesById[id];
    if (a && !Env.canUseSystem(W, a.system)) {
      World.msg(W, '息ができない。声も出せない。');
      return false;
    }
    var r = Ability.use(W, W.player, id, Target.pick(W));
    if (!r.ok) { World.msg(W, r.reason); return false; }
    recalc(W);
    return true;
  }

  /** 母船から降りたときに着く深度。そのサイトの到達最深度(初回は最浅部)。 */
  function resumeDepth(W) {
    if (!W.site) W.site = Site.starting()[0];
    var reached = Site.deepestIn(W, W.site.id) || W.site.depthMin;
    return U.clamp(reached, W.site.depthMin, W.site.depthMax);
  }

  function descend(W) {
    if (World.getTile(W.level, W.player.x, W.player.y) !== World.TILE.DOWN) {
      World.msg(W, 'ここには降下シャフトが無い。');
      return false;
    }
    if (W.depth === 0) {
      // 母船からは、選んだサイトの到達最深度へ降りる
      enterLevel(W, resumeDepth(W), false);
      return true;
    }
    // そのサイトの最深部より下へは行けない。ここが終点。
    if (W.depth >= W.site.depthMax) {
      World.msg(W, 'これより下へは繋がっていない。' + W.site.name + 'はここが最深部だ。');
      return false;
    }
    enterLevel(W, W.depth + 1, false);
    return true;
  }

  /* ================= 帰還フェーズ (docs/07 §7.5) =================
   *
   * **撃破した瞬間ではなく、母船へ帰還して初めて勝利**とする。
   * 全力を使い切った状態で戻る緊張を、最後にもう一度だけ作る。
   *
   * 崩壊が進むので、階と階の間の構造は既に落ちている。
   * 昇降機は一度に RETURN_STEP 階ぶん上がる ([[D-70]])。
   * 100階を一段ずつ登らせるのは緊張ではなく作業になる。
   */
  var RETURN_STEP = 10;

  function beginReturn(W) {
    if (W.returning) return;
    W.returning = true;
    W.originSlain = true;
    World.msg(W, '《起源》は動きを止めた。');
    World.msg(W, '構造が崩れはじめている。**母船まで戻れ。**');
  }

  /** 帰還中か。 */
  function isReturning(W) { return !!W.returning; }

  /**
   * 崩壊の進行。帰還中は毎ターン、構造そのものが敵になる。
   * 敵を増やすのではなく環境で押す ―― 最後に問われるのは、
   * それまで身につけた「引き際」の判断であるべき。
   */
  function collapseTick(W) {
    if (!W.returning || W.depth <= 0 || W.dead) return;
    var env = W.level.env;
    if (!env) return;
    // 深いほど激しい。上がるほど落ち着く = 前進が報われる
    var severity = 1 + Math.floor(W.depth / 10);
    if (W.turn % 20 === 0) {
      /* 圧は**温度**でかける。ここまで来たプレイヤーは《適合》を4つ持っているので、
         減圧・被曝・汚染・監視はどれも効かない。それらで押しても何も起きない。
         温度は《適合》の対象外で、遮蔽と耐性で凌げる ([[D-54]])。 */
      env.temperature += severity;
      env.atmosphere = Math.max(0, env.atmosphere - 1);
    }
    if (W.turn % 50 === 0) {
      World.msg(W, '構造が軋んでいる。長くはもたない。');
    }
  }

  function ascend(W) {
    if (World.getTile(W.level, W.player.x, W.player.y) !== World.TILE.UP) {
      World.msg(W, 'ここには昇降機が無い。');
      return false;
    }
    if (W.depth <= 0) { World.msg(W, 'ここが最上層だ。'); return false; }

    // 帰還中は崩落した構造を一気に抜ける
    if (W.returning) {
      var next = W.depth - RETURN_STEP;
      if (next <= 0) { enterLevel(W, 0, false); return true; }
      enterLevel(W, next, true);
      World.msg(W, '崩れた層をまとめて抜けた。母船まで深度 ' + next + '。');
      return true;
    }

    // サイトの最浅部より上は母船へ戻る
    if (W.depth <= W.site.depthMin) { enterLevel(W, 0, false); return true; }
    enterLevel(W, W.depth - 1, true);
    return true;
  }

  /**
   * 端末に接続して1つ通す (docs/11 §11.3)。
   * **ターンを消費する。** タダで階に干渉させない。
   */
  function jack(W, opId) {
    var r = Net.jack(W, opId);
    if (!r.ok && r.reason && r.dealt === undefined) {
      World.msg(W, r.reason);          // そもそも試せなかった (端末が無い等)
      return false;
    }
    recalc(W);
    return true;
  }

  function pickup(W) {
    var p = W.player;
    var here = Item.itemsAt(W, p.x, p.y);
    if (here.length === 0) { World.msg(W, 'ここには何もない。'); return false; }

    var it = here[0];

    /* ログ断片は**所持品に入れない**。読んで記録するだけ (docs/07 §7.8)。
       読み物で所持枠を圧迫させない。持ち歩く判断もさせない。 */
    if (Fragment.isFragment(it)) {
      Fragment.collect(W, it);
      Item.removeFromFloor(W, it);
      return true;
    }

    var added = Inventory.add(W.inv, it);
    if (!added) { World.msg(W, '所持品がいっぱいだ。'); return false; }

    Item.removeFromFloor(W, it);
    if (it.amount) World.msg(W, it.amount + ' クレジットを拾った。');
    else World.msg(W, Sigil.name(W.knowledge, added) + 'を拾った。');
    recalc(W);
    return true;
  }

  function drop(W, it) {
    var p = W.player;
    Inventory.remove(W.inv, it);
    it.x = p.x; it.y = p.y;
    W.items.push(it);
    World.msg(W, Sigil.name(W.knowledge, it) + 'を置いた。');
    recalc(W);
    return true;
  }

  function use(W, it) {
    if (!it.effect) { World.msg(W, 'それは使えない。'); return false; }
    var consumed = Item.applyEffect(W, W.player, it);
    if (consumed) Inventory.consume(W.inv, it, 1);
    recalc(W);
    return true;
  }

  function equip(W, it) {
    var r = Inventory.equip(W.inv, it);
    if (!r.ok) { World.msg(W, r.reason); return false; }
    it.known = true;
    // 常時発動の刻印は装備した瞬間に分かる (docs/02 §2.8)
    Sigil.reveal(W, it, 'wear');
    World.msg(W, Sigil.name(W.knowledge, it) + 'を装備した。');
    if (it.tainted) World.msg(W, '……何かが軋んでいる。');
    recalc(W);
    return true;
  }

  function unequip(W, slot) {
    var r = Inventory.unequip(W.inv, slot);
    if (!r.ok) { World.msg(W, r.reason); return false; }
    World.msg(W, Sigil.name(W.knowledge, r.item) + 'を外した。');
    recalc(W);
    return true;
  }

  /* ---------- 休息と連続移動 ([[D-50]]) ---------- */

  /**
   * 休息。HP/SP が満ちるか、敵が見えるか、資源が尽きるまで待つ。
   * **ゲームターンは正しく消費する。** タダで回復させない。
   * @returns {number} 実際に休んだターン数
   */
  function rest(W, maxTurns) {
    var p = W.player;
    var n = 0;
    maxTurns = maxTurns || 500;
    while (n < maxTurns) {
      if (W.dead) break;
      if (visibleFoe(W)) { World.msg(W, '何かが見えた。'); break; }
      if (p.hp >= p.hpMax && (!p.system || p.sp >= p.spMax)) break;
      if (p.food <= 0) { World.msg(W, '空腹で休めない。'); break; }
      if (Env.sealDeficit(W) > 0) { World.msg(W, 'ここでは休めない。'); break; }
      step(W, { type: 'move', dx: 0, dy: 0 });
      n++;
    }
    if (n > 0) World.msg(W, n + ' ターン休息した。');
    else if (p.hp >= p.hpMax) World.msg(W, '休む必要は無い。');
    return n;
  }

  /**
   * 連続移動。壁・分岐・敵・アイテム・環境変化のいずれかで停止する。
   * @returns {number} 進んだ歩数
   */
  function run(W, dx, dy, maxSteps) {
    var n = 0;
    maxSteps = maxSteps || 60;
    while (n < maxSteps) {
      if (W.dead) break;
      if (visibleFoe(W)) { if (n) World.msg(W, '何かが見えた。'); break; }

      var p = W.player;
      var nx = p.x + dx, ny = p.y + dy;
      if (!World.walkable(W.level, nx, ny)) break;
      if (World.actorAt(W, nx, ny)) break;
      if (World.getTile(W.level, nx, ny) === World.TILE.TRAP) break;

      var before = { x: p.x, y: p.y };
      if (!step(W, { type: 'move', dx: dx, dy: dy })) break;
      if (p.x === before.x && p.y === before.y) break;
      n++;

      // 足元に何かある / 階段 / 分岐 で止まる
      if (Item.itemsAt(W, p.x, p.y).length) break;
      var tile = World.getTile(W.level, p.x, p.y);
      if (tile === World.TILE.DOWN || tile === World.TILE.UP ||
          tile === World.TILE.SHOP || tile === World.TILE.DOOR) break;
      if (isBranch(W, dx, dy)) break;
    }
    return n;
  }

  /* ================= 指定地点まで歩く (travel) ================= *
   *
   * **オートエクスプロアではない** ([[D-50]] は今も有効)。
   * 却下したのは「未知の場所を勝手に探索する」ことで、その理由は
   * 「歩いた距離で電力と食料を払わせる経済が無意味になる」からだった。
   *
   * ここは**プレイヤーが既に見た場所を指して歩く**だけで、
   * ターンも電力も食料も1歩ずつ同じだけ払う。本家 Angband の travel と同じ。
   * 経路は**既知のマスの上しか通らない** ―― 見ていない場所は使えない。
   */

  var TRAVEL_MAX = 200;

  /**
   * (tx,ty) までの経路を既知のマスだけで探す。
   * @returns {Array|null} [[dx,dy], ...] の手順。届かなければ null
   */
  function pathTo(W, tx, ty) {
    var lv = W.level, p = W.player;
    if (!World.inBounds(lv, tx, ty)) return null;
    if (p.x === tx && p.y === ty) return null;
    if (!World.walkable(lv, tx, ty)) return null;
    if (!World.hasFlag(lv, tx, ty, World.F.KNOWN)) return null;

    var prev = new Int32Array(lv.w * lv.h).fill(-1);
    var start = p.y * lv.w + p.x, goal = ty * lv.w + tx;
    prev[start] = start;

    var queue = [start], found = false;
    while (queue.length && !found) {
      var next = [];
      for (var q = 0; q < queue.length && !found; q++) {
        var cur = queue[q];
        var cx = cur % lv.w, cy = (cur - cx) / lv.w;
        for (var d = 0; d < U.DIRS.length; d++) {
          var nx = cx + U.DIRS[d].dx, ny = cy + U.DIRS[d].dy;
          if (!World.inBounds(lv, nx, ny)) continue;
          var ni = ny * lv.w + nx;
          if (prev[ni] !== -1) continue;
          if (!World.walkable(lv, nx, ny)) continue;
          // 見ていない場所は通れない。地図に無い道は使えない
          if (!World.hasFlag(lv, nx, ny, World.F.KNOWN)) continue;
          prev[ni] = cur;
          if (ni === goal) { found = true; break; }
          next.push(ni);
        }
      }
      queue = next;
    }
    if (prev[goal] === -1) return null;

    var steps = [], node = goal;
    while (node !== start) {
      var px = node % lv.w, py = (node - px) / lv.w;
      var pv = prev[node];
      var qx = pv % lv.w, qy = (pv - qx) / lv.w;
      steps.unshift([px - qx, py - qy]);
      node = pv;
      if (steps.length > TRAVEL_MAX) return null;
    }
    return steps;
  }

  /**
   * 指定地点まで歩く。**1歩ずつ通常の移動として処理する**ので、
   * ターン・電力・食料・環境の作用は歩いたぶんだけ正しく払われる。
   * 中断条件は run と同じ考え方 ―― 何かあったら止まる。
   * @returns {number} 実際に歩いた歩数
   */
  function travel(W, tx, ty) {
    var path = pathTo(W, tx, ty);
    if (!path) { World.msg(W, 'そこへの道が分からない。'); return 0; }

    var p = W.player, n = 0;
    for (var i = 0; i < path.length; i++) {
      if (W.dead) break;
      if (visibleFoe(W)) { if (n) World.msg(W, '何かが見えた。'); break; }

      var nx = p.x + path[i][0], ny = p.y + path[i][1];
      if (!World.walkable(W.level, nx, ny)) break;
      if (World.actorAt(W, nx, ny)) break;
      if (World.getTile(W.level, nx, ny) === World.TILE.TRAP) break;

      var before = { x: p.x, y: p.y, hp: p.hp };
      if (!step(W, { type: 'move', dx: path[i][0], dy: path[i][1] })) break;
      if (p.x === before.x && p.y === before.y) break;
      n++;

      /* HP が減ったら止まる。環境の作用(減圧・高熱)は敵が見えなくても効くので、
         これが無いと方舟の真空区画を削られながら歩き続けてしまう。 */
      if (p.hp < before.hp) { World.msg(W, '足を止めた。'); break; }

      // 足元に何かあれば止まる。通り過ぎさせない
      if (Item.itemsAt(W, p.x, p.y).length) break;
    }
    if (n) describeFloor(W);
    return n;
  }

  /** 進行方向の左右に道が開けているか(分岐)。 */
  function isBranch(W, dx, dy) {
    var p = W.player;
    var sides = (dx !== 0 && dy !== 0)
      ? [[dx, 0], [0, dy]]
      : (dx !== 0 ? [[0, 1], [0, -1]] : [[1, 0], [-1, 0]]);
    var open = 0;
    for (var i = 0; i < sides.length; i++) {
      if (World.walkable(W.level, p.x + sides[i][0], p.y + sides[i][1])) open++;
    }
    return open > 0;
  }

  function visibleFoe(W) {
    for (var i = 0; i < W.actors.length; i++) {
      var a = W.actors[i];
      if (a.dead || a.kind === 'player') continue;
      if (a.asleep > 0) continue;                    // 眠っている敵では止まらない
      if (World.hasFlag(W.level, a.x, a.y, World.F.VISIBLE)) return a;
    }
    return null;
  }

  /**
   * コマンドを実行する。
   * @returns {boolean} ターンを消費したら true
   */
  function execPlayer(W, cmd) {
    if (W.dead) return false;
    switch (cmd.type) {
      case 'move':     return move(W, cmd.dx, cmd.dy);
      case 'descend':  return descend(W);
      case 'ascend':   return ascend(W);
      case 'pickup':   return pickup(W);
      case 'use':      return use(W, cmd.item);
      case 'equip':    return equip(W, cmd.item);
      case 'unequip':  return unequip(W, cmd.slot);
      case 'drop':     return drop(W, cmd.item);
      case 'shoot':    return shoot(W, cmd.target);
      case 'ability':  return useAbility(W, cmd.id);
      case 'jack':     return jack(W, cmd.id);
      case 'light':
        W.player.lightOff = !W.player.lightOff;
        World.msg(W, W.player.lightOff ? 'ライトを消した。' : 'ライトを点けた。');
        recalc(W);
        return true;
      default:
        return false;
    }
  }

  /* ---------- ゲームターンの維持処理 ---------- */

  function upkeep(W) {
    var p = W.player;
    Player.upkeep(W, p);

    // 環境の作用 (docs/08 §8.3)。HP とは独立に撤退理由を作る。
    Env.tick(W);
    Signature.tick(W);                           // サイト固有の機構 (昼夜・監視)

    // 状態異常はここでは減らさない。**アクター自身の手番**で減らす ([[D-93]])。

    // ライトの電力消費 (docs/00 §0.4-2)。刻印「省電」で伸びる。
    var l = W.inv.equip.light;
    if (l && l.cellUse && !p.lightOff && p.cells > 0) {
      var period = 10 + ((p.equipBonus && p.equipBonus.efficiency) || 0) * 8;
      if (W.turn % period === 0) {
        p.cells -= l.cellUse;
        if (p.cells <= 0) { p.cells = 0; World.msg(W, 'ライトが消えた。'); }
      }
    }

    // 帰投ビーコン
    if (W.recallPending > 0) {
      W.recallPending--;
      if (W.recallPending === 0) {
        World.msg(W, '回収された。');
        /* 復路も「そのサイトの到達最深度」へ。全体の到達最深度を使うと、
           浅いサイトのビーコンで別サイトの深部へ落ちてしまう ([[D-61]])。 */
        enterLevel(W, W.depth === 0 ? Cmd.resumeDepth(W) : 0, false);
      }
    }

    collapseTick(W);                     // 帰還中は構造そのものが敵になる
    recalc(W);
    // dead フラグも見る。死は一方通行 (HP が戻っても死亡は取り消せない)。
    if ((p.dead || p.hp <= 0) && !W.dead) die(W, W.lastAttacker || '不明');
  }

  /**
   * 勝利。記録を作る。墓碑(grave)と同じ枠を使い、中身だけを変える
   * ([[doc:ui]] §9.14) ―― 専用の画面機構を足さない。
   */
  function win(W) {
    W.won = true;
    W.returning = false;
    var end = Fragment.ending(W);
    W.grave = {
      won: true,
      devRun: !!W.devRun,
      seed: W.seed, turn: W.turn,
      depth: 0, depthMax: W.player.depthMax,
      level: W.player.level, exp: W.player.exp,
      cause: null,
      lineage: W.player.lineageName, role: W.player.roleName,
      credits: W.inv.credits,
      uniquesKilled: Object.keys(W.uniquesKilled || {}).length,
      loreFound: Fragment.foundCount(W),
      loreTotal: Fragment.placeable().length,
      loreRatio: end.ratio,
      ending: end.revealed.map(function (f) { return { title: f.title, text: f.text }; })
    };
    World.msg(W, '母船に帰り着いた。');
    World.msg(W, '《起源》は停止した。');
    return W.grave;
  }

  function die(W, cause) {
    W.dead = true;
    W.player.dead = true;
    W.grave = {
      seed: W.seed, turn: W.turn,
      depth: W.depth, depthMax: W.player.depthMax,
      level: W.player.level, exp: W.player.exp,
      cause: cause,
      lineage: W.player.lineageName, role: W.player.roleName,
      credits: W.inv.credits
    };
    World.msg(W, 'あなたは深度 ' + W.depth + ' で死亡した。');
  }

  /* ---------- 全体の駆動 ---------- */

  function step(W, cmd) {
    // 麻痺中は入力を受け付けない。手番だけが過ぎる ([[D-93]])。
    // 《自由行動》の刻印が無いと深部の麻痺は致命的になる (本家と同じ)。
    var frozen = !Actor.canAct(W.player);
    var consumed = frozen ? true : execPlayer(W, cmd);
    if (!consumed) return false;
    if (frozen) World.msg(W, '体が動かない。');

    // プレイヤーぶんのエネルギーはここで引く。tick には SKIP を返して
    // 二重に引かせない (Turn.tick の契約 — [[D-30]])。
    W.player.energy -= Turn.ACTION_COST;

    /* 状態異常は**そのアクター自身の手番**で減らす ([[D-93]])。
       ゲームターンで減らすと、速度110 の1手番 = 10ゲームターンなので
       書いた数字の10分の1しか続かない。 */
    Actor.tickTimers(W.player);

    function driveOthers(a) {
      if (a.kind === 'player') return Turn.SKIP;
      if (a.dead) return Turn.SKIP;
      if (Actor.canAct(a)) AI.act(W, a);               // 麻痺中もターンは消費する
      Actor.tickTimers(a);                             // 自分の手番が来たぶんだけ減る
      return Turn.ACTED;
    }

    var guard = 0;
    while (!W.dead && W.player.energy < Turn.ACTION_COST) {
      if (++guard > 10000) {
        var p = W.player;
        throw new Error('ターンが進行しない: energy=' + p.energy +
          ' speed=' + p.speed + ' effective=' + Turn.effectiveSpeed(p) +
          ' gain=' + Turn.gain(Turn.effectiveSpeed(p)) +
          ' weight=' + Inventory.totalWeight(W.inv) + '/' + Inventory.capacity(p, Env.envOf(W)) +
          ' penalty=' + Inventory.speedPenalty(p, W.inv, Env.envOf(W)));
      }
      Turn.tick(W, driveOthers);
      upkeep(W);
      World.reapDead(W);
    }
    refreshView(W);
    return true;
  }

  /** 新しいランを始める。 */
  function newGame(seed, lineageId, roleId) {
    var W = World.createWorld(seed);
    W.inv = Inventory.create();
    W.knowledge = Sigil.createKnowledge();
    W.knowledge.flavors = Sigil.assignFlavors(W.rng.derive('flavor'), RAW.flavors);
    W.lore = Lore.create();

    W.player = Player.create(W.seed, lineageId, roleId);
    World.addActor(W, W.player);

    grantStartingGear(W);
    W.progress = Site.createProgress();
    W.site = Site.starting()[0] || Site.all()[0];
    recalc(W);

    World.msg(W, 'STRATA — ' + W.player.lineageName + ' / ' + W.player.roleName);
    enterLevel(W, W.site.depthMin, false);
    return W;
  }

  /** 初期装備。ロールによって変える。 */
  function grantStartingGear(W) {
    var db = Data.get();
    var p = W.player;

    var weapon = { marine: 'pry-bar', marksman: 'service-knife', ghost: 'service-knife',
                   psion: 'service-knife', technician: 'cutting-torch',
                   xenobiologist: 'service-knife', scavenger: 'pry-bar',
                   netrunner: 'service-knife' }[p.role] || 'pry-bar';

    equipNew(W, db.itemsById[weapon]);
    equipNew(W, db.itemsById['work-suit']);
    equipNew(W, db.itemsById['hand-lamp']);

    if (p.role === 'marksman') {
      equipNew(W, db.itemsById['scrap-slinger']);
      Inventory.add(W.inv, Item.create(W.rng, db.itemsById['scrap-slug'], 25));
    }

    Inventory.add(W.inv, Item.create(W.rng, db.itemsById['ration'], 3));
    Inventory.add(W.inv, Item.create(W.rng, db.itemsById['medgel'], 2));
    Inventory.add(W.inv, Item.create(W.rng, db.itemsById['power-cell'], 2));
    W.inv.credits = 200;

    // 初期能力を1つ習得しておく (能力系ロールが何もできない状態で始まらないように)
    if (p.system) {
      var first = Ability.learnable(p)[0];
      if (first) p.abilities.push(first.id);
    }
  }

  function equipNew(W, kind) {
    if (!kind) return null;
    var it = Item.create(W.rng, kind, 1);
    it.known = true;
    Inventory.equip(W.inv, it);
    Sigil.learnKind(W, it.kindId);
    return it;
  }

  /** 降下先のサイトを選ぶ。母船でのみ。 */
  function selectSite(W, siteId) {
    var site = Site.byId(siteId);
    if (!site) return { ok: false, reason: 'そのような場所は無い。' };
    var locked = Site.lockReason(W, site);
    if (locked) return { ok: false, reason: locked };
    W.site = site;
    World.msg(W, site.name + 'を降下先にした。');
    return { ok: true, site: site };
  }

  return {
    newGame: newGame, enterLevel: enterLevel, step: step, execPlayer: execPlayer,
    selectSite: selectSite, grantAdaptationIfDeep: grantAdaptationIfDeep,
    upkeep: upkeep, recalc: recalc, populateFixed: populateFixed,
    dropParts: dropParts, PARTS_MIN_DEPTH: PARTS_MIN_DEPTH, refreshView: refreshView, die: die, onKill: onKill,
    computeFeeling: computeFeeling, feelingText: feelingText,
    DANGER_TEXT: DANGER_TEXT, LOOT_TEXT: LOOT_TEXT, TRAPS: TRAPS,
    move: move, attack: attack, shoot: shoot, pickup: pickup, use: use,
    ascend: ascend, descend: descend, jack: jack,
    equip: equip, unequip: unequip, drop: drop, useAbility: useAbility,
    rest: rest, run: run, travel: travel, pathTo: pathTo,
    TRAVEL_MAX: TRAVEL_MAX, visibleFoe: visibleFoe, resumeDepth: resumeDepth,
    beginReturn: beginReturn, isReturning: isReturning, collapseTick: collapseTick,
    win: win, RETURN_STEP: RETURN_STEP
  };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = Cmd;

/* ==== src/js/action.js (rule) ==== */
/* STRATA — GNU GPL v2. 条文は LICENSE、由来は NOTICE.md。 */
/* action.js — 文脈アクション。docs/09 §9.18 ([[D-85]])。DOM 非依存。
 *
 * 「今ここでできること」を組み立てる。
 *
 * コマンドが25個あることが問題なのではない。
 * **どの瞬間でも意味があるのは3〜6個**で、それが画面に出ていないことが問題だった。
 *
 * ここが出すのは**実行できるコマンドそのもの**で、キー入力と同じ経路を通る ([[D-57]])。
 * 各行にキーを併記するのは、一覧を松葉杖ではなく**教材**にするため ――
 * 使ううちにキーを覚えて、一覧を開かなくなるのが正しい姿。
 */
'use strict';

var Action = (function () {

  var MAX = 7;          // 全部載せると「今できること」でなくなる

  /* 並び順 = 優先度。危険なものが先頭に来る。 */
  var RANK = { danger: 0, warn: 1, tip: 2, info: 3 };

  function add(out, level, key, label, why, cmd) {
    out.push({ level: level, key: key, label: label, why: why, cmd: cmd });
  }

  /**
   * 今できることの一覧。
   * @returns {Array} { level, key, label, why, cmd }
   */
  function list(W) {
    var out = [];
    if (!W || !W.player || W.dead) return out;
    var p = W.player, lv = W.level;

    if (W.depth === 0) { hub(W, out); return trim(out); }

    danger(W, out);
    underfoot(W, out);
    adjacent(W, out);
    ranged(W, out);
    upkeepish(W, out);

    return trim(out);
  }

  function trim(out) {
    out.sort(function (a, b) { return RANK[a.level] - RANK[b.level]; });
    /* 同じ行動が二度出ないようにする。
       「気密が足りない→戻る」と「昇降機の上→戻る」が同時に立つ。
       先に来たほう(=優先度が高いほう)の理由を残す。 */
    var seen = {}, uniq = [];
    for (var i = 0; i < out.length && uniq.length < MAX; i++) {
      var key = out[i].key + '/' + out[i].label;
      if (seen[key]) continue;
      seen[key] = 1;
      uniq.push(out[i]);
    }
    return uniq;
  }

  /* ---------- 生死に関わるもの。必ず先頭に来る ---------- */

  function danger(W, out) {
    var p = W.player;

    if (Env.sealDeficit(W) > 0) {
      add(out, 'danger', '<', '戻る', '気密が足りない。ここには居られない',
          { type: 'ascend' });
    }
    if (p.hp * 3 < p.hpMax) {
      var heal = firstItem(W, function (it) { return usableKnown(W, it, 'heal'); });
      if (heal) {
        add(out, 'danger', 'u', '回復する', Sigil.name(W.knowledge, heal) + 'を使う',
            { type: 'use', item: heal });
      } else {
        add(out, 'danger', '<', '戻る', 'HP が危険。回復する物が無い', { type: 'ascend' });
      }
    }
    if (p.food < 300) {
      var food = firstItem(W, function (it) { return usableKnown(W, it, 'feed'); });
      if (food) {
        add(out, 'danger', 'u', '食べる', '衰弱しかけている', { type: 'use', item: food });
      }
    }
  }

  /* ---------- 足元 ---------- */

  function underfoot(W, out) {
    var p = W.player, lv = W.level;
    var tile = World.getTile(lv, p.x, p.y);

    if (tile === World.TILE.DOWN) {
      add(out, 'tip', '>', '降りる', 'この下へ続いている', { type: 'descend' });
    }
    if (tile === World.TILE.UP) {
      add(out, 'info', '<', '戻る', '一つ上の階へ', { type: 'ascend' });
    }
    if (tile === World.TILE.TERM) {
      add(out, 'tip', 'J', '接続する',
          '認知 ' + p.cog + '/' + p.cogMax + ' を払って階に干渉する',
          { type: 'menu', mode: 'net' });
    }

    var here = Item.itemsAt(W, p.x, p.y);
    if (here.length) {
      var it = here[0];
      if (Fragment.isFragment(it)) {
        add(out, 'tip', 'g', '読む', it.name + 'が落ちている', { type: 'pickup' });
      } else {
        add(out, 'tip', 'g', '拾う', Sigil.name(W.knowledge, it) + 'が落ちている',
            { type: 'pickup' });
      }
    }
  }

  /* ---------- 隣接 ---------- */

  function adjacent(W, out) {
    var p = W.player;
    for (var i = 0; i < W.actors.length; i++) {
      var a = W.actors[i];
      if (a.dead || a.kind === 'player') continue;
      if (U.distCheb(a.x, a.y, p.x, p.y) !== 1) continue;
      add(out, 'warn', '方向', a.name + 'を殴る',
          a.asleep > 0 ? '眠っている。不意打ちになる' : '隣にいる',
          { type: 'move', dx: Math.sign(a.x - p.x), dy: Math.sign(a.y - p.y) });
      return;                                  // 1体で足りる。列挙しない
    }
  }

  /* ---------- 視界内 ---------- */

  function ranged(W, out) {
    var p = W.player;
    var foe = Cmd.visibleFoe(W);
    if (!foe) return;

    if (W.inv.equip.launcher) {
      add(out, 'tip', 'f', '撃つ', foe.name + 'が見えている', { type: 'shoot' });
    }
    if (p.system && p.abilities.length && p.sp > 0) {
      add(out, 'tip', 'm', '能力を使う', Ability.SYSTEM_NAME[p.system] + ' ' + p.sp + '/' + p.spMax,
          { type: 'menu', mode: 'ability' });
    }
    if (!W.target) {
      add(out, 'info', 'x', '目標を選ぶ', '狙う相手を決めておく', { type: 'look' });
    }
  }

  /* ---------- 状態 ---------- */

  function upkeepish(W, out) {
    var p = W.player;

    if (W.inv.items.length >= Inventory.MAX_ITEMS) {
      add(out, 'warn', 'd', '置く', '所持品がいっぱい', { type: 'menu', mode: 'drop' });
    }
    if (p.system && Ability.canLearnMore(p) && Ability.learnable(p).length) {
      add(out, 'tip', 'm', '能力を習得', '習得できる能力がある',
          { type: 'menu', mode: 'ability' });
    }
    // 装備していない装備品を持っている
    var wear = firstItem(W, function (it) {
      return it.slot && !W.inv.equip[it.slot];
    });
    if (wear) {
      add(out, 'tip', 'w', '装備する', Sigil.name(W.knowledge, wear) + 'が空きスロットに入る',
          { type: 'equip', item: wear });
    }
    if (!Cmd.visibleFoe(W) && p.hp < p.hpMax) {
      add(out, 'info', 'R', '休息', '敵は見えていない。HP が戻る', { type: 'rest' });
    }
  }

  /* ---------- 母船 ---------- */

  function hub(W, out) {
    var p = W.player;
    var shop = Hub.shopAt(W.level, p.x, p.y);
    if (shop) {
      add(out, 'tip', 'Enter', '区画に入る',
          (Hub.shopById(shop) || { name: '格納庫' }).name, { type: 'enter' });
    }
    if (World.getTile(W.level, p.x, p.y) === World.TILE.DOWN) {
      add(out, 'tip', '>', '降りる',
          (W.site ? W.site.name : '') + ' 深度 ' + Cmd.resumeDepth(W) + ' へ',
          { type: 'descend' });
    } else if (W.level.down) {
      // 母船で最も使う行動なので、足元でなくても道筋を示す
      var d = U.distCheb(p.x, p.y, W.level.down.x, W.level.down.y);
      add(out, 'tip', '方向', '降下ポッドへ',
          d + ' マス先。その上で > を押す',
          { type: 'move',
            dx: U.clamp(W.level.down.x - p.x, -1, 1),
            dy: U.clamp(W.level.down.y - p.y, -1, 1) });
    }
    add(out, 'info', 'V', '降下先を選ぶ', '母船でしか変えられない',
        { type: 'menu', mode: 'site' });
    add(out, 'info', 'i', '所持品', '持ち物を確かめる', { type: 'menu', mode: 'inventory' });
    return out;
  }

  /* ---------- 補助 ---------- */

  function firstItem(W, pred) {
    for (var i = 0; i < W.inv.items.length; i++) {
      if (pred(W.inv.items[i])) return W.inv.items[i];
    }
    return null;
  }

  /**
   * 効果で薦めてよいアイテムか。
   * **未鑑定のものは薦めない** ([[D-78]] と同じ理由) ―― 薦めた時点で
   * 「これは回復薬だ」と教えることになり、フレーバー式の鑑定が骨抜きになる。
   */
  function usableKnown(W, it, prefix) {
    if (!it.effect || it.effect.indexOf(prefix) !== 0) return false;
    return Sigil.isKnownKind(W.knowledge, it.kindId);
  }

  return { MAX: MAX, list: list };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = Action;

/* ==== src/js/devstart.js (rule) ==== */
/* STRATA — GNU GPL v2. 条文は LICENSE、由来は NOTICE.md。 */
/* devstart.js — 開発用の起動オプション。docs/07 §7.9 ([[D-66]])。DOM 非依存。
 *
 * 1ラン15〜40時間の通しプレイを実装のたびに繰り返すことはできない。
 * 終端(深度80/98/99/100 と帰還)だけを繰り返し通せる入口が要る。
 *
 *   ?dev=depth:99,adapt:all,gear:deep,lore:80
 *
 * **開発モードで始めたランはスコアに残さない。** 記録の意味が壊れるため。
 * 手触りの検証はこれでは代替できない。通しプレイは M5 で行う。
 */
'use strict';

var DevStart = (function () {

  /** "depth:99,adapt:all" -> { depth: '99', adapt: 'all' } */
  function parse(spec) {
    var out = {};
    if (!spec) return out;
    var parts = String(spec).split(',');
    for (var i = 0; i < parts.length; i++) {
      var kv = parts[i].split(':');
      if (kv.length < 2) continue;
      out[kv[0].trim()] = kv.slice(1).join(':').trim();
    }
    return out;
  }

  var ADAPTS = ['vacuum', 'radiation', 'contamination', 'watch'];

  /**
   * 開発指定を世界に適用する。
   * @param W  Cmd.newGame で作った直後の世界
   * @param spec 文字列 (URL の ?dev= の値)
   * @returns {object} 何を適用したかの記録
   */
  function apply(W, spec) {
    var opt = parse(spec);
    var applied = { devRun: true };
    W.devRun = true;

    // --- 《適合》 ---
    if (opt.adapt) {
      var want = opt.adapt === 'all' ? ADAPTS : opt.adapt.split('+');
      for (var i = 0; i < want.length; i++) {
        if (ADAPTS.indexOf(want[i]) !== -1) Site.grantAdaptation(W, want[i]);
      }
      applied.adapt = Site.adaptationCount(W);
    }

    // --- ログ断片の収集率 (勝利画面の分岐確認用) ---
    if (opt.lore) {
      var pct = Math.max(0, Math.min(100, parseInt(opt.lore, 10) || 0));
      var pool = Fragment.placeable();
      var n = Math.round(pool.length * pct / 100);
      for (var f = 0; f < n; f++) W.loreFound[pool[f].id] = true;
      applied.lore = n;
    }

    // --- 装備と成長 ---
    if (opt.gear) applied.gear = outfit(W, opt.gear, opt.depth);

    /* --- 検証用の下駄 ---
       gear:deep は「実際に店に在るもの」しか買わないので、
       深部の装備がまだ存在しない現状では裸同然になる。
       終端の**機構**を確かめたいときだけ god:1 で耐久を底上げする。
       これはバランスの検証には使えない。使ったことは記録に残る。 */
    if (opt.god) {
      var p = W.player;
      p.hpMax = Math.max(p.hpMax, 3000);
      p.hp = p.hpMax;
      applied.god = true;
      W.godRun = true;
      /* 深部の武器がまだ存在しないので、検証用の1本をここで作る。
         **data に置かない**。名前で「これは内容ではない」と分かるようにする。 */
      Cmd.equip(W, Inventory.add(W.inv, {
        uid: Item.nextUid(), kindId: null, base: 'weapon',
        name: '《検証用の楔》', glyph: '|', color: 'red', slot: 'weapon',
        stackable: false, count: 1, weight: 0, known: true, sigils: [],
        dice: '30d10', toHit: 60, toDam: 40, ac: 40, seal: 4, x: 0, y: 0
      }));
      Cmd.recalc(W);
      p.hp = p.hpMax;
    }

    // --- 深度 ---
    if (opt.depth) {
      var d = Math.max(0, Math.min(100, parseInt(opt.depth, 10) || 0));
      var site = opt.site ? Site.byId(opt.site) : siteForDepth(W, d);
      if (site) W.site = site;
      if (d > 0) {
        W.player.depthMax = d;
        Site.noteDepth(W, W.site.id, d);
      }
      Cmd.enterLevel(W, d, false);
      applied.depth = d;
      applied.site = W.site.id;
    }

    World.msg(W, '[開発モード] ' + spec + ' ―― この記録は残らない。');
    return applied;
  }

  /** その深度を担当するサイト。《起源》が使えるならそれを優先する。 */
  function siteForDepth(W, depth) {
    var list = Site.availableAt(depth);
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === 'origin' && !Site.lockReason(W, list[i])) return list[i];
    }
    return list[0] || Site.starting()[0];
  }

  /**
   * 深度相応に育てて装備させる。
   * 店の品揃えは到達最深度で決まるので、先にそれを上げてから買う。
   */
  function outfit(W, level, depthSpec) {
    var depth = Math.max(1, Math.min(100, parseInt(depthSpec, 10) || 50));
    var target = Math.min(Player.MAX_LEVEL, level === 'deep' ? depth : Math.floor(depth / 2));

    Player.gainExp(W.player, Player.expNeeded(Math.max(1, target - 1), W.player.expFactor));
    W.player.depthMax = depth;
    W.inv.credits += depth * 400;

    Cmd.enterLevel(W, 0, false);          // 母船で仕入れる
    var rng = W.rng.derive('dev/outfit');
    for (var round = 0; round < 40; round++) {
      var bought = false;
      for (var s = 0; s < Hub.SHOPS.length; s++) {
        var shop = Hub.SHOPS[s];
        var stock = (W.shops && W.shops[shop.id]) || [];
        for (var i = 0; i < stock.length; i++) {
          if (Hub.buyPrice(W, stock[i]) > W.inv.credits) continue;
          if (Hub.buy(W, shop.id, i).ok) { bought = true; break; }
        }
      }
      if (!bought) break;
    }
    for (var r = 0; r < 3; r++) {
      var carried = W.inv.items.slice();
      for (var c = 0; c < carried.length; c++) {
        if (carried[c].slot) Cmd.equip(W, carried[c]);
      }
    }
    Cmd.recalc(W);
    W.player.hp = W.player.hpMax;
    return { level: W.player.level, ac: W.player.ac, seal: W.player.seal };
  }

  return { parse: parse, apply: apply, outfit: outfit, ADAPTS: ADAPTS };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = DevStart;

/* ==== src/js/render.js (rule) ==== */
/* STRATA — GNU GPL v2. 条文は LICENSE、由来は NOTICE.md。 */
/* render.js — 世界状態 W からグリフバッファへの純粋な写像。DOM 非依存。
 *
 * docs/01 §1.6 (D-22):
 *   W ──(ここ)──> グリフバッファ ──> 描画器 (term.js = ASCII / 将来タイル)
 * ここまで DOM に触れないので、「このシードのこのターンで画面がこう見える」
 * というスナップショットテストが書ける。
 */
'use strict';

var Render = (function () {

  /* 端末レイアウト (docs/09 §9.2, [[D-48]])。基準 80x40。
     行0-1 メッセージ / 列0-15 サイドバー / 残りがマップ。
     全角ラベルが2桁を食うため、サイドバーは 16桁必要。

     **桁数は画面に合わせて 80 以上へ広がる** ([[D-84]])。
     16:9 の画面では 80桁だと高さで頭打ちになり、左右に黒帯が残っていた。
     マップのビューポートは元から可変 ([[D-21]]) なので、桁が増えればマップが広がる。
     行数は 40 固定 ―― 縦に伸ばすと1画面の情報量が増えすぎ、端末らしさが崩れる。 */
  var COLS_MIN = 80, COLS_MAX = 140;
  /* 携帯の縦画面では 80桁が読めない。サイドバーを外して 42桁まで下げる ([[D-87]])。
     サイドバーの中身は枠外の HUD が同じものを既に出しているので、情報は失われない。 */
  var COLS_MIN_NARROW = 42;
  var SIDEBAR_W = 16;       // 列0..15 = サイドバー (出しているときだけ)
  var MSG_ROWS = 2;         // 行0..1 = メッセージ(最新2件)

  var TERM = { w: COLS_MIN, h: 40 };
  var sidebar = true;       // 端末の中にサイドバーを描くか
  var MAP = { x: SIDEBAR_W, y: MSG_ROWS, w: TERM.w - SIDEBAR_W, h: TERM.h - MSG_ROWS };

  function hasSidebar() { return sidebar; }
  function sidebarW() { return sidebar ? SIDEBAR_W : 0; }

  /** その構成で許される最小桁数。 */
  function minCols(withSidebar) {
    return withSidebar ? COLS_MIN : COLS_MIN_NARROW;
  }

  /**
   * 端末の構成を変える。**TERM / MAP は同じオブジェクトのまま書き換える** ―
   * 他のモジュールが参照を握っているので、差し替えると古い値を見続ける。
   * @param withSidebar 省略すると現在の設定を保つ
   * @returns {boolean} 実際に変わったら true
   */
  function resize(cols, withSidebar) {
    var side = withSidebar === undefined ? sidebar : !!withSidebar;
    var w = Math.max(minCols(side), Math.min(COLS_MAX, Math.floor(cols) || minCols(side)));
    if (w === TERM.w && side === sidebar) return false;
    sidebar = side;
    TERM.w = w;

    MAP.w = w - sidebarW();

  var PALETTE = {
    black:    '#05070a', dgray:  '#2a3340', gray:    '#5d6b7a', lgray:  '#9aa8b8',
    white:    '#e6edf5', red:    '#c05a4e', green:   '#5c9e5e', yellow: '#c9a24a',
    blue:     '#4a7bb0', magenta:'#9a5fa8', cyan:    '#4fa3a8', orange: '#c07a3e',
    dgreen:   '#33613a', dblue:  '#2d4a68', dred:    '#6e3630', dyellow:'#7a6330',
    edge:     '#151d27'          // サイドバーとマップの区切り帯
  };

  /* 地形のグリフ。見えている時と記憶の時で色を変える。 */
  /**
   * その地形を今どう描くか。**サイトごとに壁と床の見た目が変わる**
   * (docs/10 §10.5) ので、地形のグリフを引く箇所は全部ここを通す。
   * 凡例HUD が別に持つと「地図は `'` なのに凡例は `+`」がすぐ起きる ([[D-56]])。
   */
  function glyphFor(W, tile) {
    var site = W && W.site;
    return (site && typeof Site !== 'undefined' && Site.tileGlyph(site, tile)) ||
           TILE_GLYPH[tile];
  }

  var TILE_GLYPH = {};
  TILE_GLYPH[World.TILE.WALL]  = { ch: '#', lit: 'gray',   mem: 'dgray'  };
  TILE_GLYPH[World.TILE.FLOOR] = { ch: '.', lit: 'lgray',  mem: 'dgray'  };
  TILE_GLYPH[World.TILE.DOOR]  = { ch: '+', lit: 'orange', mem: 'dyellow'};
  TILE_GLYPH[World.TILE.DOWN]  = { ch: '>', lit: 'white',  mem: 'gray'   };
  TILE_GLYPH[World.TILE.UP]    = { ch: '<', lit: 'white',  mem: 'gray'   };
  TILE_GLYPH[World.TILE.TRAP]  = { ch: '^', lit: 'red',    mem: 'dred'   };
  TILE_GLYPH[World.TILE.SHOP]  = { ch: '=', lit: 'yellow', mem: 'dyellow'};
  TILE_GLYPH[World.TILE.TERM]  = { ch: 'Ω', lit: 'cyan',   mem: 'dblue'  };

  /**
   * 全角判定。固定幅グリッドに日本語を書くので、CJK は 2セルを占有させる。
   * これをしないとメッセージ行以降の桁が全てズレる。
   */

    return (c >= 0x1100 && c <= 0x115F) ||   // ハングル字母

           (c >= 0xAC00 && c <= 0xD7A3) ||   // ハングル音節
           (c >= 0xF900 && c <= 0xFAFF) ||   // CJK 互換漢字
           (c >= 0xFE30 && c <= 0xFE6F) ||   // CJK 互換形
           (c >= 0xFF00 && c <= 0xFF60) ||   // 全角英数

   * 空のグリフバッファ。cells[y*w+x] = {ch, fg, bg, w}

   */

    var c = buf.cells[y * buf.w + x];

    if (wide === 2) {

    paralyzed: ['麻痺', 'red'], blind: ['盲目', 'dgray'], haste: ['加速', 'cyan'], slow: ['減速', 'dred']

  function drawSidebar(buf, W) {
    var p = W.player;
    var row = MSG_ROWS;          // メッセージ行の下から始める

      // ラベルが全角を含むので、実際に消費したセル数を使って値を置く

      if (value !== undefined) {

      }

    }
    text(buf, 0, row++, 'STRATA', 'cyan');
    line('Lv', String(p.level), 'white');
    line('EXP', String(p.exp));
    row++;
    line('HP', p.hp + '/' + p.hpMax, p.hp * 2 < p.hpMax ? 'red' : 'green');
    if (p.system) {
      line(Ability.SYSTEM_NAME[p.system], p.sp + '/' + p.spMax,
           p.sp === 0 ? 'gray' : 'magenta');
    }
    // 認知は電脳層の資源 (docs/11 §11.2)。端末に出会う場所でだけ意味を持つので、
    // 満タンのときは出さない ―― サイドバーは常に見る場所であって、辞書ではない
    if (p.cog < p.cogMax) {
      line('認知', p.cog + '/' + p.cogMax, p.cog === 0 ? 'red' : 'cyan');
    }
    line('AC', String(p.ac || 0));
    line('速度', Turn.speedLabel(Turn.effectiveSpeed(p)),
         Turn.effectiveSpeed(p) < Turn.NORMAL_SPEED ? 'red' :
         (Turn.effectiveSpeed(p) > Turn.NORMAL_SPEED ? 'cyan' : 'white'));
    row++;
    line('深度', W.depth === 0 ? '母船' : String(W.depth), 'yellow');
    if (W.depth > 0 && W.site) text(buf, 0, row++, W.site.short, 'cyan', 'black', SIDEBAR_W);
    line('電力', String(p.cells), p.cells < 50 ? 'red' : 'cyan');
    line('食料', String(Math.floor(p.food / 100)), p.food < 500 ? 'red' : 'white');
    line('$', String(W.inv ? W.inv.credits : 0), 'yellow');
    row++;

    // 階の予感 (docs/02 §2.3)。有望度は歩いて初めて開示される。
    if (W.depth > 0 && W.feeling) {
      var d = U.clamp(W.feeling.danger, 0, 9);
      line('危険', String(d), d >= 6 ? 'red' : (d >= 3 ? 'yellow' : 'gray'));
      line('有望', W.feeling.lootKnown ? String(U.clamp(W.feeling.loot, 0, 9)) : '?',
           W.feeling.lootKnown && W.feeling.loot >= 6 ? 'cyan' : 'gray');
    }

    // 環境の警告。**危険な値だけ**を出す (docs/08 §8.8)。
    // 出ている = 何か起きている、という読み方を成立させる。
    var warn = Env.warnings(W);
    if (warn.length) {
      row++;
      for (var wi = 0; wi < warn.length; wi++) {
        line(warn[wi].label, warn[wi].value, warn[wi].color);
      }
    }

    // 状態異常

    for (var k in TIMER_TAG) {
      if (p.timers && p.timers[k] > 0) {
        if (!anyTimer) { row++; anyTimer = true; }
        text(buf, 0, row++, TIMER_TAG[k][0], TIMER_TAG[k][1], 'black', SIDEBAR_W);
      }
    }

    // 指定中の目標 ([[D-49]])
    var tgt = W.target && Target.resolve(W);
    if (tgt) {
      row++;
      text(buf, 0, row++, '目標', 'gray', 'black', SIDEBAR_W);
      text(buf, 0, row++, tgt.name, 'yellow', 'black', SIDEBAR_W);
    }

    // シードは常時表示する。不具合報告と再現に必須なので隠さない。
    text(buf, 0, TERM.h - 3, 'T ' + W.turn, 'dgray', 'black', SIDEBAR_W);
    text(buf, 0, TERM.h - 2, 'seed', 'dgray', 'black', SIDEBAR_W);
    text(buf, 0, TERM.h - 1, String(W.seed).slice(0, SIDEBAR_W), 'dgray', 'black', SIDEBAR_W);

    /* サイドバーとマップの区切り。'|' のグリフだとセル高より文字が低く、
       縦に隙間が空いて点線に見える。背景色の帯にすると繋がる。 */
    for (var y = MSG_ROWS; y < TERM.h; y++) put(buf, SIDEBAR_W - 1, y, ' ', 'edge', 'edge');
  }

  /** メッセージは最新2件。新しいものが上 (docs/09 §9.2)。 */
  function drawMessages(buf, W) {
    var n = W.messages.length;
    for (var i = 0; i < MSG_ROWS; i++) {
      var m = W.messages[n - 1 - i];
      if (!m) break;
      var s = m.text + (m.count > 1 ? ' (x' + m.count + ')' : '');
      text(buf, 0, i, s, i === 0 ? 'white' : 'gray', 'black', TERM.w);
    }
  }

  /**
   * 世界状態 W からグリフバッファを作る。副作用なし。
   * **W が null でも落ちない。** キャラクター作成画面は世界が存在する前に描かれる。
   */
  function frame(W) {
    var buf = createBuffer(TERM.w, TERM.h);
    if (!W) {
      text(buf, 2, 1, 'STRATA', 'cyan');
      return buf;
    }
    if (W.level) drawMap(buf, W);
    if (sidebar) drawSidebar(buf, W);
    drawMessages(buf, W);
    return buf;
  }

  /** テスト・デバッグ用: バッファを文字列にする (色は落ちる)。
   *  全角の後続セル (w=0) は飛ばすので、CJK を2桁で表示する端末で桁が揃う。 */
  function toText(buf) {
    var out = [];
    for (var y = 0; y < buf.h; y++) {
      var s = '';
      for (var x = 0; x < buf.w; x++) {
        var c = buf.cells[y * buf.w + x];
        if (c.w === 0) continue;
        s += c.ch;
      }
      out.push(s.replace(/\s+$/, ''));
    }
    return out.join('\n');
  }

  return {
    TERM: TERM, MAP: MAP, SIDEBAR_W: SIDEBAR_W, MSG_ROWS: MSG_ROWS,
    COLS_MIN: COLS_MIN, COLS_MAX: COLS_MAX, COLS_MIN_NARROW: COLS_MIN_NARROW,
    resize: resize, hasSidebar: hasSidebar, sidebarW: sidebarW, minCols: minCols,
    PALETTE: PALETTE, TILE_GLYPH: TILE_GLYPH, glyphFor: glyphFor,
    isWide: isWide,
    createBuffer: createBuffer, put: put, text: text, putMap: putMap,
    viewOrigin: viewOrigin, frame: frame, toText: toText

})();

if (typeof module !== 'undefined' && module.exports) module.exports = Render;

/* legend.js — 凡例HUD の中身を計算する。docs/09 §9.11 ([[D-56]])。DOM 非依存。
 *
 * 原則: **今画面にあるものだけ**を出す。全一覧は出さない。

  function visible(W) {
    var lv = W.level, out = { terrain: [], monsters: [], items: [] };
    if (!lv) return out;

    var seenTile = {}, seenMon = {}, seenItem = {};
    var i;

    // 地形: 既知グリッドに出ている種類
    for (i = 0; i < lv.tiles.length; i++) {
      if (!(lv.flags[i] & World.F.KNOWN)) continue;
      var t = lv.tiles[i];
      if (seenTile[t]) continue;
      seenTile[t] = true;
      var g = Render.glyphFor(W, t);       // 地図と同じ見た目を出す
      if (!g) continue;
      out.terrain.push({
        ch: g.ch, color: g.lit,
        label: World.TILE_INFO[t].name,
        detail: TILE_HELP[t] || ''

    }

    // 敵: 見えている / 検出済みのもの。同じ種族はまとめる。
    for (i = 0; i < W.actors.length; i++) {
      var a = W.actors[i];
      if (a.dead || a.kind === 'player') continue;
      var vis = World.hasFlag(lv, a.x, a.y, World.F.VISIBLE);
      if (!vis && !a.detected) continue;
      if (seenMon[a.raceId]) { seenMon[a.raceId].count++; continue; }

      var base = Data.get().monsterBase[a.base];
      var entry = {
        ch: a.glyph, color: a.asleep > 0 ? 'dgray' : a.color,
        label: a.name, count: 1,
        detail: (base ? base.name : '') + (a.asleep > 0 ? ' / 眠っている' : ''),
        raceId: a.raceId, asleep: a.asleep > 0

    }

    // アイテム: 既知グリッドにあるもの
    for (i = 0; i < W.items.length; i++) {
      var it = W.items[i];
      if (!World.hasFlag(lv, it.x, it.y, World.F.KNOWN)) continue;
      var key = it.kindId + '/' + (it.egoId || '') + '/' + (it.uniqueId || '');
      if (seenItem[key]) { seenItem[key].count++; continue; }
      var ie = {
        ch: it.glyph,
        color: it.uniqueId ? 'yellow' : (it.egoId ? 'cyan' : (it.tainted ? 'magenta' : it.color)),
        label: Sigil.name(W.knowledge, it), count: 1,
        detail: Data.get().itemBase[it.base].name

  TILE_HELP[World.TILE.FLOOR] = '通れる';
  TILE_HELP[World.TILE.DOOR] = '通れる。方舟では気圧を区切っている';
  TILE_HELP[World.TILE.DOWN] = '> で深く潜る';
  TILE_HELP[World.TILE.UP] = '< で戻る';
  TILE_HELP[World.TILE.TRAP] = '踏むと作動する';

    if (p.system) {
      out.push({ label: Ability.SYSTEM_NAME[p.system], value: p.sp + '/' + p.spMax,
                 help: '能力(m)を使うと減る' });
    }
    if (p.cog < p.cogMax) {
      out.push({ label: '認知', value: p.cog + '/' + p.cogMax,
                 help: '端末(J)に接続すると減る。時間でしか戻らない。0 で昏倒' });
    }
    out.push({ label: 'AC', value: String(p.ac || 0),
               help: '高いほど敵の攻撃が当たりにくい' });
    out.push({ label: '速度', value: Turn.speedLabel(Turn.effectiveSpeed(p)),
               help: '+10 で行動回数が2倍。最も重要な値' });
    out.push({ label: '深度', value: W.depth === 0 ? '母船' : String(W.depth),
               help: '唯一の難易度尺度。深いほど強い敵と良い品が出る' });
    if (W.depth > 0 && W.site) {
      out.push({ label: W.site.short, value: W.site.depthMin + '〜' + W.site.depthMax,
                 help: 'この場所の深度レンジ。最深部のユニークが《適合》を落とす' });
    }
    out.push({ label: '電力', value: String(p.cells),
               help: 'ライトと射出器の燃料。0 になると光が消える' });
    out.push({ label: '食料', value: String(Math.floor(p.food / 100)),
               help: '0 になると衰弱して減り続ける' });

    if (W.depth > 0 && W.feeling) {
      out.push({ label: '危険', value: String(W.feeling.danger),
                 help: '0〜9。この階にどれだけ強い敵がいるか' });
      out.push({ label: '有望', value: W.feeling.lootKnown ? String(W.feeling.loot) : '?',
                 help: '0〜9。歩き回ると分かる' });
    }

    var warn = Env.warnings(W);
    for (var i = 0; i < warn.length; i++) {
      out.push({ label: warn[i].label, value: warn[i].value,
                 color: warn[i].color, help: WARN_HELP[warn[i].label] || '' });
    }
    return out;
  }

  var WARN_HELP = {
    '気密': '左が今の気密、右がこの階で必要な量。足りないと毎ターン減る',
    '被曝': '溜まると能力値が落ちる。母船の情報屋で除染できる',
    '汚染': '溜まると変異する。良い変異も悪い変異もある',
    '補足': '監視に見つかっている。増援が来る'
  };

  /* ---------- 状況に応じたヒント ---------- */

  /**
   * 「今何をすべきか」を状況から出す。
   * これが枠外UI の中心。チュートリアルを書かずに操作を教える。
   * @returns {Array} { level: 'danger'|'warn'|'info'|'tip', text }
   */
  function hints(W) {
    var out = [];
    if (!W || !W.player) return out;
    var p = W.player, lv = W.level;

    if (W.dead) {
      out.push({ level: 'danger', text: 'あなたは死んだ。N で新しいランを始める。' });
      return out;
    }

    /* --- 生死に関わるもの --- */
    var deficit = Env.sealDeficit(W);
    if (deficit > 0) {
      out.push({ level: 'danger',
        text: '気密が足りない。ここには居られない。' +
              '< で戻るか、気密のあるスーツ(装甲廠で買える)を装備すること。' });
    }
    if (p.hp * 3 < p.hpMax) {
      out.push({ level: 'danger',
        text: 'HP が危険。u で回復アイテムを使うか、< で戻ること。' });
    }
    if (p.food < 500 && !Player.hasFlag(p, 'NO_FOOD')) {
      out.push({ level: 'warn', text: '空腹。u で携行食を食べること。' });
    }
    if (p.cells <= 0) {
      out.push({ level: 'warn',
        text: '電力が尽きた。ライトが点かない。u で電力セルを装填すること。' });
    } else if (p.cells < 60) {
      out.push({ level: 'warn', text: '電力が少ない。L でライトを消せば節約できる。' });
    }
    if (p.exposure >= Env.EXPOSURE_STEP) {
      out.push({ level: 'warn', text: '被曝が進んでいる。母船の情報屋で除染できる。' });
    }
    if (p.contamination >= Env.CONTAMINATION_STEP) {
      out.push({ level: 'warn', text: '汚染が進んでいる。次の閾値で変異する。' });
    }

    /* --- 目の前の状況 --- */
    var adjacent = null, sleepingAdjacent = null, visibleCount = 0;
    for (var i = 0; i < W.actors.length; i++) {
      var a = W.actors[i];
      if (a.dead || a.kind === 'player') continue;
      if (!World.hasFlag(lv, a.x, a.y, World.F.VISIBLE)) continue;
      visibleCount++;
      if (U.distCheb(a.x, a.y, p.x, p.y) === 1) {
        adjacent = a;
        if (a.asleep > 0) sleepingAdjacent = a;
      }
    }

    if (sleepingAdjacent) {
      out.push({ level: 'tip',
        text: sleepingAdjacent.name + 'は眠っている。今攻撃すれば必ず当たり、不意打ちになる。' });
    } else if (adjacent) {
      out.push({ level: 'info',
        text: adjacent.name + 'が隣にいる。その方向へ移動すると攻撃する。' });
    }

    if (visibleCount >= 2 && !W.target) {
      out.push({ level: 'tip', text: 'x で目標を選べる。奥の敵を狙える。' });
    }

    /* 足元のものは action.js が**押せる行動**として出す ([[D-85]])。
       ここで同じことを文章でも書くと、ガイドに同じ助言が二度並ぶ。
       ヒントは「なぜそうすべきか」を担い、行動そのものは Action が担う。 */

    /* --- 持ち物 --- */
    var wearable = null;
    for (var j = 0; j < W.inv.items.length; j++) {
      if (W.inv.items[j].slot) { wearable = W.inv.items[j]; break; }
    }
    if (wearable) {
      out.push({ level: 'tip',
        text: '装備できるものを持っている。w で装備できる。' });
    }
    if (W.inv.items.length >= Inventory.MAX_ITEMS) {
      out.push({ level: 'warn', text: '所持品がいっぱい。d で不要なものを置くこと。' });
    }

    /* 成長・拾得・装備といった「押せば済むこと」は action.js が担う ([[D-85]])。
       ここは**そうすべき理由と、その危うさ**だけを言う。 */

    /* --- 電脳層 (docs/11 §11.3) --- */
    if (typeof Net !== 'undefined' && Net.atTerminal(W)) {
      out.push({ level: 'warn',
        text: '接続中に認知が尽きると昏倒する。端末の前で無防備になるので、' +
              '周囲を片付けてからにするか、賭けるかを決めること。' });
    }
    if (typeof Net !== 'undefined' && Net.isBlinded(W)) {
      out.push({ level: 'tip', text: '走査系を止めてある。しばらく補足されない。' });
    }

    /* --- サイト固有の助言 (docs/10 §10.2) --- */
    var sig = W.site && W.site.signature;
    if (W.depth > 0 && sig === 'pressure') {
      out.push({ level: 'tip',
        text: '区画ごとに気圧が違う。隔壁扉(+)を通ると気圧が均され、' +
              '差が大きいと突風で敵ごと吹き飛ぶ。' });
    } else if (W.depth > 0 && sig === 'daynight') {
      out.push({ level: 'tip',
        text: (W.level && W.level.night)
          ? '夜。暗いが被曝は少ない。敵は強い。'
          : '昼。見通しは良いが被曝する。遮蔽物の陰にいれば被曝が減る。' });
    } else if (W.depth > 0 && sig === 'surveillance' && W.alerted) {
      out.push({ level: 'danger',
        text: '監視網に補足されている。増援が湧き続ける。' +
              '階を移るか、端末(Ω)で監視を切るか、L でライトを消すこと。' });
    } else if (W.depth > 0 && sig === 'dark') {
      out.push({ level: 'tip',
        text: '光源が無い。ライトの半径が視界の全て。電力が尽きたら何も見えない。' });
    }

    /* --- 母船は助言が全く違う場面なので専用にする --- */
    if (W.depth === 0) {
      out.push({ level: 'tip',
        text: '交易区(=)に Enter で入れる。装甲廠で気密のあるスーツ、' +
              '補給所で携行食と電力セルを買っておくこと。' });
      if (p.exposure > 0 || p.contamination > 0) {
        out.push({ level: 'tip', text: '情報屋で除染を受けられる(C)。' });
      }
      out.push({ level: 'info',
        text: '中央の降下ポッド(>)から、選んだ場所の到達最深部へ降りられる。' });
      if (typeof Site !== 'undefined') {
        var n = Site.adaptationCount(W);
        out.push({ level: n >= 4 ? 'tip' : 'info',
          text: 'V で降下先を選ぶ。《適合》' + n + '/4' +
                (n >= 4 ? ' ―― 《起源》へ行ける。' : '。4つ揃うと《起源》へ行ける。') });
      }
      return out;
    }

    /* --- 入ったばかりで地図がほとんど白紙のとき --- */
    if (lv && lv.tiles) {
      var known = 0;
      for (var k = 0; k < lv.flags.length; k++) if (lv.flags[k] & World.F.KNOWN) known++;
      if (known / lv.flags.length < 0.04) {
        out.push({ level: 'info',
          text: '見えていない場所は表示されない。歩いて地図を作る。' +
                'ライトの半径が視界の全て。' });
      }
    }

    /* --- 何も無いときの基本 --- */
    if (out.length === 0) {
      out.push({ level: 'info',
        text: '降下シャフト(>)を探して深く潜る。深度が唯一の難易度尺度。' });
    }
    return out;
  }

  /** 全部まとめて。panel.js はこれだけを呼ぶ。 */
  function compute(W) {
    return { visible: visible(W), status: status(W), hints: hints(W) };
  }

  return {
    compute: compute, visible: visible, status: status, hints: hints,
    TILE_HELP: TILE_HELP, WARN_HELP: WARN_HELP
  };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = Legend;

/* STRATA — GNU GPL v2. 条文は LICENSE、由来は NOTICE.md。 */
/* term.js — グリフバッファを Canvas に描く疑似ターミナル。shell 層 (DOM を触る)。
 *
 * ここは「バッファを絵にする」だけで、ゲームの判断は一切しない (docs/01 §1.6)。
 * タイル描画に差し替えるときは、このファイルの drawCell だけを置き換える。
 */
'use strict';

var Term = (function () {

  var canvas = null, ctx = null;
  /* ★寸法はすべて **device pixel** で持つ。
     CSS px で持って dpr を掛けると、セル境界が小数ピクセルに落ちて
     塗り直しの継ぎ目が滲み、差分描画で前の文字の縁が残る ([[D-59]])。 */
  var cellW = 0, cellH = 0, fontPx = 0, dpr = 1, glyphW = 0;
  var cssCellW = 0, cssCellH = 0;  // 当たり判定用 (画面座標 -> セル)
  var LINE_HEIGHT = 1.15;          // セル高 / フォントサイズ
  var prev = null;   // 前フレームのバッファ。差分だけ描き直す。

  /**
   * 端末が収まる最大の文字サイズを選ぶ。
   * 枠外UI(操作パネル・凡例HUD)があるので、**ウィンドウではなく #stage の実寸**を見る
   * ([[D-55]])。パネルを畳んだときも自動で追従する。
   */
  function fit() {
    var rows = Render.TERM.h;
    var stage = canvas.parentElement;
    var availW = (stage ? stage.clientWidth : window.innerWidth) - 8;
    var availH = (stage ? stage.clientHeight : window.innerHeight) - 8;

    dpr = window.devicePixelRatio || 1;

    // 文字幅とフォントサイズの比を実測する(フォントによって違う)
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.font = '100px ' + FONT;
    var ratioW = ctx.measureText('W').width / 100 || 0.6;

    /* ★桁数を先に決める ([[D-84]])。
       行数は固定なのでセルの高さは availH で決まり、
       セルの縦横比を自然比に保つと1桁ぶんの幅も決まる。
       その幅で availW に何桁入るかが、この画面で出せる桁数。
       こうすると 16:9 の画面でも左右の黒帯が消え、マップが広く見える。 */
    var natural = ratioW / LINE_HEIGHT;
    var cellHFit = Math.max(6, Math.floor(availH * dpr / rows));
    var cellWFit = Math.max(4, Math.round(cellHFit * natural));
    var fitCols = Math.floor(availW * dpr / cellWFit);

    /* サイドバーを持つかは**画面幅だけ**で決める ([[D-87]])。
       CSS が縦積みにする幅(900px 以下)では必ず畳み、16桁をマップに回す。
       状態は枠外の HUD が要約札で出すので、情報は失われない。

       ★ここで端末側の都合(fitCols)だけを根拠にすると、
       CSS のレイアウトが変わって測定が変わり、測定がまた CSS を変える循環になる。
       判断は「画面幅 → 縦積みか → サイドバーを持つか」の一方向に保つ。 */
    var stacked = typeof window.matchMedia === 'function' &&
                  window.matchMedia('(max-width: 900px)').matches;
    Render.resize(fitCols, !stacked && fitCols >= Render.COLS_MIN);

    var cols = Render.TERM.w;

    /* ★セル寸法を先に決め、フォントをそこから逆算する。
       逆順(フォント→セル)にすると、cellH = fontPx * 行間 の分だけ
       端末が縦にはみ出して下端が切れる。
       ★寸法は device pixel の整数で決める。CSS px で決めて dpr を掛けると
       境界が小数になり、塗り直しの継ぎ目に前の文字の縁が残る ([[D-59]])。 */
    cellW = Math.max(4, Math.floor(availW * dpr / cols));
    cellH = Math.max(6, Math.floor(availH * dpr / rows));

    /* さらに、セルの縦横比を**フォントの自然な比**に揃える。
       揃えないと、制約の緩い方向にセルだけが広がって文字間が間延びする。
       桁数を先に決めてあるので、ここでの調整は丸め誤差ぶんに収まる。 */
    if (cellW / cellH > natural) cellW = Math.max(4, Math.round(cellH * natural));
    else cellH = Math.max(6, Math.round(cellW / natural));

    // セルに収まる最大のフォント(device pixel)
    fontPx = Math.max(7, Math.min(
      Math.floor(cellH / LINE_HEIGHT),
      Math.floor(cellW / ratioW)
    ));

    // バッキングストアは device pixel 単位。変換行列は等倍のまま使う。
    canvas.width = cols * cellW;
    canvas.height = rows * cellH;
    cssCellW = cellW / dpr;
    cssCellH = cellH / dpr;
    canvas.style.width = (cols * cssCellW) + 'px';
    canvas.style.height = (rows * cssCellH) + 'px';

    ctx.setTransform(1, 0, 0, 1, 0, 0);          // 等倍 = 境界が必ず整数
    ctx.font = fontPx + 'px ' + FONT;
    ctx.textBaseline = 'middle';                 // セルの縦中央に置く
    glyphW = ctx.measureText('W').width;
    prev = null;   // サイズが変わったら全描き直し
  }

  var FONT = '"Consolas", "DejaVu Sans Mono", "Courier New", monospace';

  function init(el) {
    canvas = el;
    ctx = canvas.getContext('2d', { alpha: false });
    canvas.tabIndex = 0;          // キー入力を受けるため
    fit();
    canvas.focus();
    window.addEventListener('resize', function () { fit(); if (last) draw(last); });
  }

  function drawCell(x, y, cell) {
    if (cell.w === 0) return;              // 全角の後続セルは先頭が描いている
    var span = cell.w || 1;
    var px = x * cellW, py = y * cellH;
    var boxW = cellW * span;

    ctx.fillStyle = Render.PALETTE[cell.bg] || Render.PALETTE.black;
    ctx.fillRect(px, py, boxW, cellH);

    if (cell.ch !== ' ' && cell.ch !== '') {
      ctx.fillStyle = Render.PALETTE[cell.fg] || Render.PALETTE.white;
      /* セル内で中央寄せする。セル幅はフォント幅より少し広いので、
         左寄せのままだと文字の右側だけ空いて画面が間延びして見える。 */
      var w = span === 1 ? glyphW : ctx.measureText(cell.ch).width;
      var ox = Math.max(0, (boxW - Math.min(w, boxW)) / 2);

      /* ★グリフを必ずセルの中に閉じ込める ([[D-60]])。
         フォントのインクは em box を上下に超えることがあり(特に和文の
         フォールバックや括弧・記号)、はみ出した分は隣のセルに残る。
         差分描画は変わったセルしか塗り直さないので、
         「上の行は変わらず下の行だけ変わる」と、上の行に前の文字の縁が残る。
         maxWidth だけでは横しか止まらないので、矩形でクリップする。 */
      ctx.save();
      ctx.beginPath();
      ctx.rect(px, py, boxW, cellH);
      ctx.clip();
      ctx.fillText(cell.ch, px + ox, py + cellH / 2, boxW);
      ctx.restore();
    }
  }

  var last = null;

  /** バッファを描く。前フレームと同じセルは飛ばす。 */
  function draw(buf) {
    last = buf;
    if (!prev || prev.w !== buf.w || prev.h !== buf.h) {
      ctx.fillStyle = Render.PALETTE.black;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      prev = null;
    }
    for (var y = 0; y < buf.h; y++) {
      for (var x = 0; x < buf.w; x++) {
        var i = y * buf.w + x;
        var c = buf.cells[i];
        if (prev) {
          var p = prev.cells[i];
          if (p.ch === c.ch && p.fg === c.fg && p.bg === c.bg && p.w === c.w) continue;
        }
        drawCell(x, y, c);
      }
    }
    // 次フレームとの比較用にコピーを取る (buf は使い回されないが念のため)
    prev = { w: buf.w, h: buf.h, cells: buf.cells.map(function (c) {
      return { ch: c.ch, fg: c.fg, bg: c.bg, w: c.w };
    }) };
  }

  /**
   * 画面座標を端末のセル座標に変換する。マウス操作の土台 ([[D-57]])。
   * @returns {object|null} { x, y } 端末セル。範囲外なら null
   */
  function cellAt(clientX, clientY) {
    if (!canvas || !cssCellW || !cssCellH) return null;
    // 当たり判定は CSS px。描画は device px なので単位が違う点に注意。
    var r = canvas.getBoundingClientRect();
    var x = Math.floor((clientX - r.left) / cssCellW);
    var y = Math.floor((clientY - r.top) / cssCellH);
    if (x < 0 || y < 0 || x >= Render.TERM.w || y >= Render.TERM.h) return null;
    return { x: x, y: y };
  }

  /** クリックハンドラを繋ぐ。handler({x,y}) は端末セル座標を受け取る。 */
  function onClick(handler) {
    if (!canvas) return;
    canvas.addEventListener('click', function (ev) {
      canvas.focus();
      var cell = cellAt(ev.clientX, ev.clientY);
      if (cell) handler(cell, ev);
    });
  }

  /** 再測定して描き直す。パネルの開閉から呼ぶ。 */
  function relayout() {
    fit();
    if (last) draw(last);
  }

  return {
    init: init, draw: draw, cellAt: cellAt, onClick: onClick, relayout: relayout,
    focus: function () { if (canvas) canvas.focus(); }
  };
})();

        white: '#f0f2f5', red: '#c25a28', green: '#5fb8e8', yellow: '#f5e07a',
        blue: '#3f6fbf', magenta: '#b07ad0', cyan: '#7fd8e0', orange: '#e08a3a',
        dgreen: '#2f5f7a', dblue: '#26456a', dred: '#7a3618', dyellow: '#7d6a25',
        edge: '#141a22'
      }
    },

    /* 高コントラスト。彩度より明暗をはっきりさせる。 */
    contrast: {
      name: '高コントラスト',
      desc: '明暗をはっきりさせる',
      /* 走査線と発光を切る。**意匠のために可読性を下げない** ([[D-82]])。
         この配色を選ぶ人は、読みやすさのために選んでいる。 */
      crt: 0,
      colors: {
        black: '#000000', dgray: '#404040', gray: '#8a8a8a', lgray: '#c8c8c8',
        white: '#ffffff', red: '#ff6b5a', green: '#5aff7a', yellow: '#ffe14a',
        blue: '#6aa8ff', magenta: '#e08aff', cyan: '#5affe6', orange: '#ffab4a',
        dgreen: '#2f7a3f', dblue: '#2f5a8a', dred: '#8a3a2f', dyellow: '#8a7a2f',
        edge: '#242424'
      }
    }
  };

  var SCALES = [
    { id: 'small', name: '小', value: 0.85 },
    { id: 'normal', name: '標準', value: 1.0 },
    { id: 'large', name: '大', value: 1.2 },
    { id: 'xlarge', name: '特大', value: 1.45 }
  ];

  var state = { palette: 'normal', scale: 'normal' };
  var onChange = null;

  function palettes() {
    var out = [];
    for (var k in PALETTES) out.push({ id: k, name: PALETTES[k].name, desc: PALETTES[k].desc });

  }

  function scales() { return SCALES.slice(); }

  function current() { return { palette: state.palette, scale: state.scale }; }

  function scaleValue() {
    for (var i = 0; i < SCALES.length; i++) if (SCALES[i].id === state.scale) return SCALES[i].value;
    return 1;
  }

  /* ---------- 適用 ---------- */

  function apply() {
    var pal = PALETTES[state.palette] || PALETTES.normal;
    // Render.PALETTE を差し替える。端末も枠外UI も同じ表を見ている
    for (var k in pal.colors) Render.PALETTE[k] = pal.colors[k];

    if (typeof document !== 'undefined' && document.documentElement) {
      var root = document.documentElement.style;
      root.setProperty('--bg', pal.colors.black);
      root.setProperty('--ink', pal.colors.white);
      root.setProperty('--dim', pal.colors.gray);
      root.setProperty('--accent', pal.colors.cyan);
      root.setProperty('--warn', pal.colors.yellow);
      root.setProperty('--danger', pal.colors.red);
      root.setProperty('--tip', pal.colors.cyan);
      root.setProperty('--ui-scale', String(scaleValue()));
      // コンソール意匠の強度 (docs/09 §9.16)
      root.setProperty('--crt', String(pal.crt === undefined ? 1 : pal.crt));
    }
    if (onChange) onChange();
  }

  function set(what, value) {
    if (what === 'palette' && PALETTES[value]) state.palette = value;
    else if (what === 'scale') {
      for (var i = 0; i < SCALES.length; i++) if (SCALES[i].id === value) state.scale = value;
    } else return false;
    save();
    apply();
    return true;
  }

  /** 次の候補へ回す。キー1つで切り替えられるようにするため。 */
  function cycle(what) {
    var list = what === 'palette' ? palettes() : scales();
    var cur = state[what];
    var i = 0;
    for (var n = 0; n < list.length; n++) if (list[n].id === cur) i = n;
    return set(what, list[(i + 1) % list.length].id);
  }

  /* ---------- 永続化 ---------- */

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* 保存できなくても続行 */ }
  }

  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (s && PALETTES[s.palette]) state.palette = s.palette;
      if (s && s.scale) state.scale = s.scale;
    } catch (e) { /* 読めなくても既定で動く */ }
  }

  /** @param notify 変更時に呼ぶ (再描画のため) */
  function init(notify) {
    onChange = notify || null;
    load();
    apply();
  }

  return {
    KEY: KEY, PALETTES: PALETTES, SCALES: SCALES,
    palettes: palettes, scales: scales, current: current, scaleValue: scaleValue,
    init: init, apply: apply, set: set, cycle: cycle, load: load
  };
})();

'use strict';

  /* 操作パネルの内容。cmd はそのまま boot の exec へ渡る。 */

    },
    {
      name: '持ち物', items: [
        { key: 'g', label: '拾う', cmd: { type: 'pickup' } },
        { key: 'i', label: '所持品', cmd: { type: 'menu', mode: 'inventory' } },
        { key: 'u', label: '使う', cmd: { type: 'menu', mode: 'use' } },

  /* ---------- 操作パネル ---------- */

    cmdEl.appendChild(el('p', 'p-note', 'クリックでも、キーでも動く。'));

    for (var g = 0; g < GROUPS.length; g++) {

      var sec = el('section', 'p-group');
      sec.appendChild(el('h3', null, group.name));

      for (var i = 0; i < group.items.length; i++) {
        var item = group.items[i];

        row.type = 'button';
        row.appendChild(el('span', 'p-key', item.key));
        row.appendChild(el('span', 'p-label', item.label));
        if (item.note) row.appendChild(el('span', 'p-sub', item.note));

        if (item.cmd) {
          row.dataset.cmd = JSON.stringify(item.cmd);
        } else {
          row.classList.add('p-info');       // 説明だけの行(押しても何も起きない)

        }
        if (item.need) row.dataset.need = item.need;
        sec.appendChild(row);
      }
      cmdEl.appendChild(sec);
    }

    // クリックはキーと同じ経路へ ([[D-57]])
    cmdEl.addEventListener('click', function (ev) {
      var btn = ev.target.closest ? ev.target.closest('.p-cmd') : null;
      if (!btn || !btn.dataset.cmd || btn.disabled) return;
      dispatch(JSON.parse(btn.dataset.cmd));
    });
  }

  /** 使えないコマンドを淡色にする。 */
  function refreshCommands(W) {
    if (!cmdEl) return;
    var buttons = cmdEl.querySelectorAll('.p-cmd[data-need]');
    for (var i = 0; i < buttons.length; i++) {
      var b = buttons[i];
      var ok = true;
      if (!W || !W.player) ok = false;
      else if (b.dataset.need === 'launcher') ok = !!W.inv.equip.launcher;

  /* ---------- 凡例HUD ---------- */

    legendEl.appendChild(el('div', 'l-strip'));
    legendEl.appendChild(el('div', 'l-body'));
  }

  /** 端末のサイドバーと同じ値を、横に並べた札で出す。 */

    strip.innerHTML = '';

    var rows = Legend.status(W);
    for (var i = 0; i < rows.length; i++) {

      chip.appendChild(el('span', 'l-chip-v', rows[i].value));

  function color(name) { return Render.PALETTE[name] || Render.PALETTE.white; }

  function glyphRow(entry) {
    var row = el('div', 'l-row');
    var g = el('span', 'l-glyph', entry.ch);
    g.style.color = color(entry.color);
    row.appendChild(g);
    var name = entry.label + (entry.count > 1 ? ' ×' + entry.count : '');

    var body = legendEl.querySelector('.l-body');
    if (!body) return;
    body.innerHTML = '';

    if (!W || !W.player) {
      body.appendChild(el('p', 'p-note', 'キャラクターを選ぶと、ここに画面の説明が出る。'));

    if (data.visible.monsters.length) {

      for (i = 0; i < data.visible.monsters.length; i++) {
        ms.appendChild(glyphRow(data.visible.monsters[i]));

    if (data.visible.items.length) {
      var is = section('落ちているもの');

  function buildLog() {

   * 端末の上2行より長く遡れる。

    body.dataset.at = String(msgs.length);
    body.innerHTML = '';

    for (var i = from; i < msgs.length; i++) {
      var m = msgs[i];

      row.appendChild(el('span', 'm-text', m.text));

  var MODES = [

    { id: 'slim', name: '簡易', cls: 'ui-slim' },
    { id: 'bare', name: '非表示', cls: 'ui-bare' }

  var modeIndex = 0;

  function mode() { return MODES[modeIndex]; }

  /** 次の段へ回す。@returns {object} 新しい段 */
  function cycleMode(app, label) {
    modeIndex = (modeIndex + 1) % MODES.length;
    return applyMode(app, label);
  }

  function setMode(app, label, id) {
    for (var i = 0; i < MODES.length; i++) if (MODES[i].id === id) modeIndex = i;
    return applyMode(app, label);
  }

  function applyMode(app, label) {
    if (app) {
      for (var i = 0; i < MODES.length; i++) {
        if (MODES[i].cls) app.classList.remove(MODES[i].cls);
      }
      if (mode().cls) app.classList.add(mode().cls);
    }
    if (label) label.textContent = '表示 ' + mode().name + ' \\';
    return mode();
  }

  /* ---------- 公開 ---------- */

  /**
   * @param opts { commands, legend } DOM 要素
   * @param send コマンドを流す先 (boot.exec)
   */
  function init(opts, send) {
    cmdEl = opts.commands;
    legendEl = opts.legend;
    guideEl = opts.guide;
    logEl = opts.log;
    dispatch = send;
    if (cmdEl) buildCommands();
    if (legendEl) buildLegend();
    if (guideEl) buildGuide();
    if (logEl) buildLog();
  }

  /** 毎描画で呼ぶ。 */
  function refresh(W) {
    refreshCommands(W);
    refreshStrip(W);
    refreshLegend(W);
    refreshGuide(W);
    refreshLog(W);
  }

  return {
    init: init, refresh: refresh, GROUPS: GROUPS,
    MODES: MODES, mode: mode, cycleMode: cycleMode, setMode: setMode,
    LOG_MAX: LOG_MAX
  };
})();

'use strict';

var UI = (function () {

  var mode = null;
  var context = null;     // 店 id など、モードごとの付随情報
  var LETTERS = 'abcdefghijklmnopqrstuvw';
