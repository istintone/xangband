/* ai.js — 敵の意思決定。DOM 非依存。
 *
 * docs/02 §2.9 の水準を目標にする。過剰に賢くしない ([[D-13]])。
 * 「物量と事故」が Angband の面白さなので、AI の賢さより数と多様性を優先する。
 *
 * 経路探索は本家式の**音のマップ(flow)** ([[D-35]])。
 * プレイヤー起点の BFS 距離マップを敵が下る。壁を回り込めるので、
 * 通路や角で待ち伏せる挙動が自然に出る。
 */
'use strict';

var AI = (function () {

  var SIGHT = 14;          // 視線での索敵半径
  var FLOW_MAX = 40;       // 音が届く距離。これを超えると寄ってこない
  var FLEE_HP_RATIO = 0.2;
  var UNREACHED = 65535;

  /* ---------- 音のマップ (flow) ---------- */

  /**
   * プレイヤーを起点に BFS で距離マップを作る。
   * 1階 6000マス程度なので、プレイヤーが動くたびに作り直しても軽い。
   */
  function computeFlow(W) {
    var lv = W.level;
    var n = lv.w * lv.h;
    var dist = new Uint16Array(n);
    for (var i = 0; i < n; i++) dist[i] = UNREACHED;

    var start = W.player.y * lv.w + W.player.x;
    dist[start] = 0;
    var queue = [start];
    var head = 0;

    while (head < queue.length) {
      var cur = queue[head++];
      var d = dist[cur];
      if (d >= FLOW_MAX) continue;
      var cx = cur % lv.w, cy = (cur - cx) / lv.w;

      for (var k = 0; k < U.DIRS.length; k++) {
        var nx = cx + U.DIRS[k].dx, ny = cy + U.DIRS[k].dy;
        if (!World.inBounds(lv, nx, ny)) continue;
        var ni = ny * lv.w + nx;
        if (dist[ni] !== UNREACHED) continue;
        if (!World.walkable(lv, nx, ny)) continue;
        dist[ni] = d + 1;
        queue.push(ni);
      }
    }
    W.flow = dist;
    return dist;
  }

  function flowAt(W, x, y) {
    if (!W.flow || !World.inBounds(W.level, x, y)) return UNREACHED;
    return W.flow[y * W.level.w + x];
  }

  /**
   * 敵からプレイヤーが見えるか。
   * プレイヤーと同じ視界判定を使う ([[D-29]])。
   * 「敵からは壁越しに見えている」という理不尽を作らない。
   */
  function canSee(W, mon, p) {
    if (U.distCheb(mon.x, mon.y, p.x, p.y) > SIGHT) return false;
    return FOV.lineOfSight(W.level, mon.x, mon.y, p.x, p.y);
  }

  function canStep(W, mon, x, y) {
    if (!World.walkable(W.level, x, y)) return false;
    var other = World.actorAt(W, x, y);
    return !other || other.kind === 'player';
  }

  /**
   * 音のマップを下って1歩。値が最も小さい隣接マスへ進む。
   * 同値なら配列順(決定論を保つため乱数を使わない)。
   */
  function stepByFlow(W, mon) {
    var here = flowAt(W, mon.x, mon.y);
    if (here === UNREACHED) return null;

    var best = null, bestD = here;
    for (var k = 0; k < U.DIRS.length; k++) {
      var d = U.DIRS[k];
      var nx = mon.x + d.dx, ny = mon.y + d.dy;
      if (!canStep(W, mon, nx, ny)) continue;
      var v = flowAt(W, nx, ny);
      if (v < bestD) { bestD = v; best = [d.dx, d.dy]; }
    }
    return best;
  }

  /** 音のマップを**登る** = プレイヤーから遠ざかる。 */
  function stepAwayByFlow(W, mon) {
    var here = flowAt(W, mon.x, mon.y);
    var best = null, bestD = here === UNREACHED ? -1 : here;
    for (var k = 0; k < U.DIRS.length; k++) {
      var d = U.DIRS[k];
      var nx = mon.x + d.dx, ny = mon.y + d.dy;
      if (!canStep(W, mon, nx, ny)) continue;
      var v = flowAt(W, nx, ny);
      if (v !== UNREACHED && v > bestD) { bestD = v; best = [d.dx, d.dy]; }
    }
    return best;
  }

  /** ランダムな1歩 (不規則移動・徘徊)。 */
  function stepRandom(W, mon) {
    var dirs = W.rng.shuffle(U.DIRS.slice());
    for (var i = 0; i < dirs.length; i++) {
      if (canStep(W, mon, mon.x + dirs[i].dx, mon.y + dirs[i].dy)) {
        return [dirs[i].dx, dirs[i].dy];
      }
    }
    return null;
  }

  /* ---------- 睡眠と覚醒 ([[D-40]]) ---------- */

  /**
   * プレイヤーの騒音。隠密技能が高いほど小さい。
   * 距離で減衰し、視界内なら倍になる。
   */
  function noiseFor(W, mon, sees) {
    var stealth = (W.player.skills && W.player.skills.stealth) || 0;
    var noise = Math.max(1, 30 - stealth);
    var dist = U.distCheb(mon.x, mon.y, W.player.x, W.player.y);
    var n = noise / (1 + dist);
    if (sees) n *= 2;
    // 汚染ファーム「発信」は位置を発信し続ける
    if (W.player.equipBonus && W.player.equipBonus.noise > 0) n *= 3;
    return n;
  }

  /**
   * 覚醒判定。一度起きた敵は二度と眠らない。
   * @returns {boolean} 起きていれば true
   */
  function wakeCheck(W, mon, sees) {
    if (mon.asleep <= 0) return true;
    mon.asleep -= noiseFor(W, mon, sees);
    if (mon.asleep <= 0) {
      mon.asleep = 0;
      if (World.hasFlag(W.level, mon.x, mon.y, World.F.VISIBLE)) {
        World.msg(W, mon.name + 'が気づいた。');
      }
      return true;
    }
    return false;
  }

  /**
   * 1体ぶんの行動。
   * @returns {boolean} 常に true (敵は必ずターンを消費する)
   */
  function act(W, mon) {
    var p = W.player;

    if (!Actor.canAct(mon)) return true;        // 麻痺など

    var sees = canSee(W, mon, p);
    if (!wakeCheck(W, mon, sees)) return true;  // 眠っている
    if (sees) Lore.noteSeen(W, mon);

    // 逃走判定。COWARD は早めに、NO_FEAR は絶対に逃げない。
    if (!Monster.hasFlag(mon, 'NO_FEAR')) {
      var ratio = mon.hp / mon.hpMax;
      var threshold = Monster.hasFlag(mon, 'COWARD') ? 0.4 : FLEE_HP_RATIO;
      mon.fleeing = ratio < threshold || mon.timers.afraid > 0;
    }

    /* 遠隔。射線が通っていれば、隣接していても撃つ(本家と同じ)。
       撃った手番は移動も殴打もしない ([[D-68]])。 */
    if (sees && !mon.fleeing && Combat.willCast(W, mon)) {
      Combat.monsterCast(W, mon, p);
      return true;
    }

    var adjacent = U.distCheb(mon.x, mon.y, p.x, p.y) === 1;
    if (adjacent && !mon.fleeing) {
      Combat.monsterAttack(W, mon, p);
      return true;
    }

    var step = null;

    if (mon.fleeing) {
      step = stepAwayByFlow(W, mon);
      if (!step && adjacent) {                  // 逃げ場が無いなら反撃
        Combat.monsterAttack(W, mon, p);
        return true;
      }
      if (!step) step = stepRandom(W, mon);
    } else if (mon.timers.confused > 0) {
      step = stepRandom(W, mon);                // 混乱中は方向が定まらない
    } else if (Monster.hasFlag(mon, 'ERRATIC') && W.rng.oneIn(3)) {
      step = stepRandom(W, mon);                // 不規則移動
    } else {
      // 音のマップを下る。届いていなければ徘徊する。
      step = stepByFlow(W, mon);
      if (!step && W.rng.oneIn(2)) step = stepRandom(W, mon);
    }

    if (step) {
      var nx = mon.x + step[0], ny = mon.y + step[1];
      var other = World.actorAt(W, nx, ny);
      if (other && other.kind === 'player') {
        Combat.monsterAttack(W, mon, p);
      } else {
        mon.x = nx; mon.y = ny;
      }
    }
    return true;
  }

  return {
    SIGHT: SIGHT, FLOW_MAX: FLOW_MAX, UNREACHED: UNREACHED,
    computeFlow: computeFlow, flowAt: flowAt,
    noiseFor: noiseFor, wakeCheck: wakeCheck,
    act: act, canSee: canSee,
    stepByFlow: stepByFlow, stepAwayByFlow: stepAwayByFlow
  };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = AI;

/* ==== src/js/item.js (rule) ==== */
/* STRATA — GNU GPL v2. 条文は LICENSE、由来は NOTICE.md。 */
/* item.js — アイテムの生成・効果・床への配置。DOM 非依存。
 *
 * M1 は「基本形のみ」。改修品(エゴ)・固有機材・ルーン式鑑定は M2 (docs/04)。
 */
'use strict';

var Item = (function () {

  var nextId = 1;

  /** 定義から実体を作る。定義(kind)は共有し、個体の状態だけを持つ。 */
  function create(rng, kind, count) {
    var base = Data.get().itemBase[kind.base];
    var it = {
      uid: nextId++,
      kindId: kind.id,
      base: kind.base,
      name: kind.name,
      glyph: base.glyph,
      color: base.color,
      slot: base.slot,
      stackable: !!base.stack,
      count: count || 1,
      weight: kind.weight || 0,
      x: 0, y: 0
    };
    // 種別ごとの値をコピー (存在するものだけ)
    ['dice', 'toHit', 'toDam', 'ac', 'seal', 'radius', 'cellUse', 'effect', 'cost',
     'mult', 'ammo', 'ammoType'].forEach(function (k) {
      if (kind[k] !== undefined) it[k] = kind[k];
    });
    it.sigils = [];
    it.pval = 0;
    if (kind.charges) it.charges = Data.rollDice(rng, kind.charges);
    if (kind.base === 'credit') it.count = 1;
    return it;
  }

  /* ---------- 改修品(エゴ)・固有機材 (docs/02 §2.8) ---------- */

  /**
   * 「良い品」の判定。深度が深いほど通りやすい (本家の構造)。
   * @returns {'normal'|'ego'|'unique'}
   */
  function qualityRoll(rng, depth) {
    // 本家 GREAT_OBJ / GOOD_OBJ 相当。深度で線形に上がり、上限で頭打ち。
    var goodChance = Math.min(45, 8 + depth);          // %
    if (rng.int(100) >= goodChance) return 'normal';
    var greatChance = Math.min(35, 4 + Math.floor(depth / 2));
    if (rng.int(100) < greatChance) return 'unique';
    return 'ego';
  }

  /** その深度・そのベースに付けられる改修品を1つ選ぶ。 */
  function pickEgo(rng, base, depth) {
    var list = Data.get().egos.filter(function (e) {
      return e.bases.indexOf(base) !== -1;
    });
    /* 改修品も装備と同じように歳を取る ([[D-77]])。
       既定の猶予のままだと、深度80 の装備に「補強(+2)」が付いてしまう。 */
    return Data.allocate(rng, list, depth, Data.ITEM_WINDOW);
  }

  function applyEgo(it, ego) {
    it.egoId = ego.id;
    it.egoName = ego.name;
    it.toHit = (it.toHit || 0) + (ego.toHit || 0);
    it.toDam = (it.toDam || 0) + (ego.toDam || 0);
    it.ac = (it.ac || 0) + (ego.ac || 0);
    it.pval = ego.pval || 0;
    it.sigils = (ego.sigils || []).slice();
    if (ego.taint) {
      // 汚染ファームは強力な利点と同居する形でのみ生成する ([[D-07]])
      it.sigils = it.sigils.concat(ego.taint);
      it.tainted = true;
    }
    it.cost = (it.cost || 0) + (ego.cost || 0);
    return it;
  }

  /**
   * 固有機材を試みる。**1ランに1個**しか存在しない ([[D-38]])。
   * @param W 生成済みフラグを持つ世界状態。null なら固有機材を作らない。
   */
  function tryUnique(rng, W, base, depth) {
    if (!W) return null;
    var list = Data.get().uniques.filter(function (u) {
      return u.base === base && !W.uniquesMade[u.id];
    });
    if (list.length === 0) return null;
    var u = Data.allocate(rng, list, depth);
    if (!u) return null;
    W.uniquesMade[u.id] = true;
    return u;
  }

  function applyUnique(it, u) {
    it.uniqueId = u.id;
    it.name = u.name;
    it.egoName = null;
    it.toHit = u.toHit || 0;
    it.toDam = u.toDam || 0;
    if (u.ac !== undefined) it.ac = u.ac;
    it.pval = u.pval || 0;
    it.sigils = (u.sigils || []).slice();
    if (u.taint) { it.sigils = it.sigils.concat(u.taint); it.tainted = true; }
    it.cost = u.cost || it.cost;
    it.desc = u.desc;
    return it;
  }

  /**
   * 深度に応じたアイテムを1つ作る。
   * @param W 固有機材の生成済み管理に使う。省略すると固有機材は出ない。
   */
  function makeForDepth(rng, depth, W) {
    var kind = Data.pickItem(rng, depth);
    if (!kind) return null;

    if (kind.base === 'credit') {
      var money = create(rng, kind, 1);
      money.amount = rng.range(5, 20) + depth * rng.range(2, 8);
      return money;
    }

    var count = 1;
    if (kind.base === 'ampule' || kind.base === 'protocol') count = rng.oneIn(4) ? 2 : 1;
    if (kind.base === 'ration' || kind.base === 'cell') count = rng.range(1, 3);
    if (kind.base === 'ammo') count = rng.range(8, 24);
    var it = create(rng, kind, count);

    // 装備できるものだけが改修品・固有機材になりうる
    if (it.slot) {
      var q = qualityRoll(rng, depth);
      if (q === 'unique') {
        var u = tryUnique(rng, W, kind.id, depth);
        if (u) return applyUnique(it, u);
        q = 'ego';                                  // 固有機材が尽きたら改修品に落とす
      }
      if (q === 'ego') {
        var ego = pickEgo(rng, kind.base, depth);
        if (ego) applyEgo(it, ego);
      }
    }
    return it;
  }

  /** 同じものとして重ねられるか。 */
  function canStack(a, b) {
    return a.stackable && b.stackable && a.kindId === b.kindId && !a.amount && !b.amount;
  }

  /** 階層に床アイテムを撒く。 */
  function populate(rng, W, depth) {
    var count = 3 + rng.range(0, 3) + Math.floor(depth / 4);
    for (var i = 0; i < count; i++) {
      var it = makeForDepth(rng, depth, W);
      if (!it) continue;
      var spot = Monster.findSpawnSpot(rng, W, 0);
      if (!spot) continue;
      it.x = spot.x; it.y = spot.y;
      W.items.push(it);
    }
  }

  /** 指定座標にアイテムを1つ置く (区画テンプレート/Vault の * と & 用)。 */
  function placeAt(rng, W, x, y, depth) {
    var it = makeForDepth(rng, depth, W);
    if (!it) return null;
    it.x = x; it.y = y;
    W.items.push(it);
    return it;
  }

  function itemsAt(W, x, y) {
    var out = [];
    for (var i = 0; i < W.items.length; i++) {
      if (W.items[i].x === x && W.items[i].y === y) out.push(W.items[i]);
    }
    return out;
  }

  function removeFromFloor(W, it) {
    var i = W.items.indexOf(it);
    if (i !== -1) W.items.splice(i, 1);
  }

  /* ---------- 消費アイテムの効果 ---------- */

  /**
   * 効果の解決は effect.js に委譲する。
   * 「アンプルで回復」と「能力で回復」を二重実装しない。
   * @returns {boolean} 消費したら true
   */
  function applyEffect(W, p, it) {
    var consumed = Effect.apply(W, p, it.effect, null);
    if (consumed) Sigil.learnKind(W, it.kindId);   // 使えば種別が分かる (フレーバー式)
    return consumed;
  }

  function revealAround(W, cx, cy, r) { return Effect.revealAround(W, cx, cy, r); }
  function teleport(W, a, dist) { return Effect.teleport(W, a, dist); }

  function nextUid() { return nextId++; }

  /** セーブからの復元後に uid の採番を進める (衝突防止)。 */
  function syncNextId(items) {
    for (var i = 0; i < items.length; i++) {
      if (items[i].uid >= nextId) nextId = items[i].uid + 1;
    }
  }

  return {
    create: create, makeForDepth: makeForDepth, canStack: canStack,
    qualityRoll: qualityRoll, pickEgo: pickEgo, applyEgo: applyEgo,
    tryUnique: tryUnique, applyUnique: applyUnique, placeAt: placeAt,
    populate: populate, itemsAt: itemsAt, removeFromFloor: removeFromFloor,
    applyEffect: applyEffect, teleport: teleport, revealAround: revealAround,
    nextUid: nextUid, syncNextId: syncNextId
  };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = Item;

/* ==== src/js/fragment.js (rule) ==== */
/* STRATA — GNU GPL v2. 条文は LICENSE、由来は NOTICE.md。 */
/* fragment.js — ログ断片。docs/07 §7.3, §7.8。DOM 非依存。
 *
 * 物語を**説明せずに**置くための唯一の手段 ([[D-45]])。
 * 強制イベントもカットシーンも作らない。落ちているものを拾って読むだけ。
 *
 * 拾った時点で全文が読め、**所持品には入らない**。
 * 読み物で所持枠を圧迫させないため。収集済みの id は W.loreFound に溜まり、
 * 勝利画面での結末の解像度を決める (§7.8)。
 *
 * データは src/data/lore.json。敵の知識 (lore.js) とは別物。
 */
'use strict';

var Fragment = (function () {

  function all() { return Data.get().fragments; }

  function byId(id) { return Data.get().fragmentsById[id]; }

  /** 床に置ける断片(stage 5 は勝利画面専用なので除く)。 */
  function placeable() {
    return all().filter(function (f) { return f.stage < 5; });
  }

  /** 収集済みか。 */
  function found(W, id) { return !!(W.loreFound && W.loreFound[id]); }

  function foundCount(W) {
    return W.loreFound ? Object.keys(W.loreFound).length : 0;
  }

  /** 収集率 0..1。分母は**床に置ける断片だけ**(集められないものを分母に入れない)。 */
  function ratio(W) {
    var total = placeable().length;
    if (!total) return 0;
    var got = 0;
    var list = placeable();
    for (var i = 0; i < list.length; i++) if (found(W, list[i].id)) got++;
    return got / total;
  }

  /**
   * この深度・このサイトで出うる、まだ拾っていない断片。
   * 深度帯を守るのは、開示の順序そのものが設計だから (§7.3)。
   */
  function candidates(W, depth, siteId) {
    return placeable().filter(function (f) {
      if (found(W, f.id)) return false;
      if (depth < f.depthMin || depth > f.depthMax) return false;
      if (f.sites && f.sites.indexOf(siteId) === -1) return false;
      return true;
    });
  }

  /**
   * 床に断片を1つ置く。候補が無ければ何も置かない。
   * @returns {object|null} 置いたアイテム
   */
  function place(rng, W, x, y, depth) {
    var siteId = W.site ? W.site.id : null;
    var pool = candidates(W, depth, siteId);
    if (!pool.length) return null;
    return dropAt(W, rng.pick(pool), x, y);
  }

  /** 指定の断片を床に置く。 */
  function dropAt(W, frag, x, y) {
    var it = {
      uid: Item.nextUid(),
      kindId: null,
      fragmentId: frag.id,
      base: 'fragment',
      name: frag.title,
      glyph: '?',
      color: 'yellow',
      slot: null,
      stackable: false,
      count: 1,
      weight: 0,
      known: true,
      sigils: [],
      x: x, y: y
    };
    W.items.push(it);
    return it;
  }

  /**
   * 断片を拾った。**所持品には入れず**、読んで記録する。
   * @returns {boolean} 新しく記録したら true
   */
  function collect(W, it) {
    var frag = byId(it.fragmentId);
    if (!frag) return false;
    if (!W.loreFound) W.loreFound = {};

    var isNew = !W.loreFound[frag.id];
    W.loreFound[frag.id] = true;

    World.msg(W, '―― ' + frag.title + ' ――');
    World.msg(W, frag.text);
    if (isNew) {
      World.msg(W, '記録した。(' + foundCount(W) + '/' + placeable().length + ')');
    }
    return isNew;
  }

  function isFragment(it) { return !!(it && it.fragmentId); }

  /**
   * 勝利画面で開示する結末 (§7.8)。収集率で解像度が変わる。
   * **全部集めなくても勝てる。集めた者だけが意味を知る。**
   */
  var TIERS = [
    { min: 0.85, take: 4 },
    { min: 0.60, take: 3 },
    { min: 0.30, take: 2 },
    { min: 0.00, take: 0 }
  ];

  function ending(W) {
    var r = ratio(W);
    var take = 0;
    for (var i = 0; i < TIERS.length; i++) {
      if (r >= TIERS[i].min) { take = TIERS[i].take; break; }
    }
    var finale = all().filter(function (f) { return f.stage === 5; });
    finale.sort(function (a, b) { return a.id < b.id ? -1 : 1; });
    return { ratio: r, revealed: finale.slice(0, take), total: finale.length };
  }

  return {
    all: all, byId: byId, placeable: placeable,
    found: found, foundCount: foundCount, ratio: ratio,
    candidates: candidates, place: place, dropAt: dropAt,
    collect: collect, isFragment: isFragment, ending: ending
  };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = Fragment;

/* ==== src/js/inventory.js (rule) ==== */
/* STRATA — GNU GPL v2. 条文は LICENSE、由来は NOTICE.md。 */
/* inventory.js — 所持品・装備スロット・重量。DOM 非依存。
 *
 * docs/02 §2.8: 重量超過で速度が落ちる。取捨選択を強いる本家の仕組みは必ず入れる。
 */
'use strict';

var Inventory = (function () {

  var MAX_ITEMS = 23;   // a〜w。本家と同じく1画面に収まる数に抑える

  /* 装備スロット。M1 で使うぶんだけ。implant は M2 で2枠に増やす。 */
  var SLOTS = ['weapon', 'launcher', 'body', 'plate', 'light', 'neck', 'implant', 'implant2'];
  var SLOT_NAME = {
    weapon: '兵装', launcher: '射出器', body: 'スーツ', plate: '装甲板',
    light: 'ライト', neck: 'ニューラルリンク', implant: 'インプラント', implant2: 'インプラント2'
  };
  /* implant2 は系統 EXTRA_IMPLANT(義体化人類) のみ使える。 */
  function slotEnabled(p, slot) {
    if (slot === 'implant2') return Player.hasFlag(p, 'EXTRA_IMPLANT');
    return true;
  }

  function create() {
    var eq = {};
    for (var i = 0; i < SLOTS.length; i++) eq[SLOTS[i]] = null;
    return { items: [], equip: eq, credits: 0 };
  }

  /**
   * 積載上限。体力から決まる (docs/02 §2.8)。18/xx 対応。
   * @param env 現在階の環境。渡すと重力が効く (docs/08 §8.3)。
   */
  function capacity(p, env) {
    var base = 200 + Stat.carryMult(Stat.effective(p, 'str')) * 60;
    return env ? Math.round(base * Env.carryMod(env)) : base;
  }

  function totalWeight(inv) {
    var w = 0, i;
    for (i = 0; i < inv.items.length; i++) w += inv.items[i].weight * inv.items[i].count;
    for (i = 0; i < SLOTS.length; i++) {
      var e = inv.equip[SLOTS[i]];
      if (e) w += e.weight;
    }
    return w;
  }

  /**
   * 重量超過による速度低下。
   * 上限の 100% を超えるごとに -1 ずつ、最大 -10。
   */
  function speedPenalty(p, inv, env) {
    var cap = capacity(p, env);
    var over = totalWeight(inv) - cap;
    if (over <= 0) return 0;
    return -Math.min(10, 1 + Math.floor(over / Math.max(1, cap / 10)));
  }

  /**
   * 所持品に加える。スタックできればまとめる。
   * @returns {object|null} 入った項目。満杯なら null
   */
  function add(inv, it) {
    if (it.amount) {                      // クレジット
      inv.credits += it.amount;
      return it;
    }
    if (it.stackable) {
      for (var i = 0; i < inv.items.length; i++) {
        if (Item.canStack(inv.items[i], it)) {
          inv.items[i].count += it.count;
          return inv.items[i];
        }
      }
    }
    if (inv.items.length >= MAX_ITEMS) return null;
    inv.items.push(it);
    sort(inv);
    return it;
  }

  /** 1個(または n 個)減らす。0 になったら取り除く。 */
  function consume(inv, it, n) {
    n = n || 1;
    it.count -= n;
    if (it.count <= 0) {
      var i = inv.items.indexOf(it);
      if (i !== -1) inv.items.splice(i, 1);
    }
  }

  function remove(inv, it) {
    var i = inv.items.indexOf(it);
    if (i !== -1) inv.items.splice(i, 1);
  }

  /** 種別順→名前順。表示の並びが安定するようにする。 */
  function sort(inv) {
    var order = {};
    var bases = Data.get().itemBase;
    var n = 0;
    for (var k in bases) order[k] = n++;
    inv.items.sort(function (a, b) {
      var d = (order[a.base] || 0) - (order[b.base] || 0);
      if (d !== 0) return d;
      return a.kindId < b.kindId ? -1 : (a.kindId > b.kindId ? 1 : 0);
    });
  }

  /**
   * 装備する。同じスロットに既に何かあれば所持品へ戻す。
   * @returns {object} { ok, replaced, reason }
   */
  function equip(inv, it, p) {
    if (!it.slot) return { ok: false, reason: 'これは装備できない。' };

    var slot = it.slot;
    // インプラントは空いている枠を探す (義体化人類は2枠)
    if (slot === 'implant' && inv.equip.implant && p && slotEnabled(p, 'implant2') && !inv.equip.implant2) {
      slot = 'implant2';
    }
    var prev = inv.equip[slot] || null;
    remove(inv, it);
    inv.equip[slot] = it;
    if (prev) {
      if (!add(inv, prev)) {
        // 戻せないなら装備を元に戻す(アイテムを消さない)
        inv.equip[slot] = prev;
        add(inv, it);
        return { ok: false, reason: '所持品がいっぱいで持ち替えられない。' };
      }
    }
    return { ok: true, replaced: prev, slot: slot };
  }

  function unequip(inv, slot) {
    var it = inv.equip[slot];
    if (!it) return { ok: false, reason: '何も装備していない。' };
    if (!add(inv, it)) return { ok: false, reason: '所持品がいっぱいだ。' };
    inv.equip[slot] = null;
    return { ok: true, item: it };
  }

  /* ---------- 装備から導かれる値 ---------- */

  function weapon(inv) { return inv.equip.weapon; }

  /**
   * 装備の刻印をすべて集計する。
   * 未知の刻印も**効果は発揮する**(知らないだけで効いている — 本家準拠)。
   */
  function equipBonus(inv) {
    var all = [];
    var pvalMax = 0;
    for (var i = 0; i < SLOTS.length; i++) {
      var e = inv.equip[SLOTS[i]];
      if (!e || !e.sigils) continue;
      all = all.concat(e.sigils);
      pvalMax = Math.max(pvalMax, e.pval || 0);
    }
    // pval は装備ごとに違うが、M2 では最大値でまとめる。
    // 【暫定】装備ごとに個別集計するのは M3 で検討する。
    return Sigil.collect(all, pvalMax || 1);
  }

  function totalAC(inv) {
    var ac = 0;
    for (var i = 0; i < SLOTS.length; i++) {
      var e = inv.equip[SLOTS[i]];
      if (e && e.ac) ac += e.ac;
    }
    return ac;
  }

  function totalSeal(inv) {
    var s = 0;
    for (var i = 0; i < SLOTS.length; i++) {
      var e = inv.equip[SLOTS[i]];
      if (e && e.seal) s += e.seal;
    }
    return s;
  }

  /** 光源半径。ライトを装備していて電力があれば伸びる。刻印「照射」で加算。 */
  function lightRadius(p, inv) {
    if (p.timers.blind > 0) return 0;
    var base = Math.max(1, p.infra || 0);              // 系統の暗視
    var l = inv.equip.light;
    if (l && l.radius && p.cells > 0 && !p.lightOff) base = Math.max(base, l.radius);
    if (p.equipBonus && p.equipBonus.light) base += p.equipBonus.light;
    return U.clamp(base, 0, 6);
  }

  /**
   * 表示ラベル。鑑定状態を反映する (sigil.js が名前を組み立てる)。
   * @param K 知識。省略すると素の名前になる(テスト用)。
   */
  function label(it, K) {
    var s = K ? Sigil.name(K, it) : it.name;
    if (it.count > 1) s = it.count + '個の' + s;
    if (it.charges !== undefined) s += ' (' + it.charges + ')';
    if (it.tainted) s += ' {汚染}';
    if (it.damaged) s += ' {損傷}';
    return s;
  }

  return {
    MAX_ITEMS: MAX_ITEMS, SLOTS: SLOTS, SLOT_NAME: SLOT_NAME, slotEnabled: slotEnabled,
    equipBonus: equipBonus,
    create: create, capacity: capacity, totalWeight: totalWeight, speedPenalty: speedPenalty,
    add: add, consume: consume, remove: remove, sort: sort,
    equip: equip, unequip: unequip,
    weapon: weapon, totalAC: totalAC, totalSeal: totalSeal, lightRadius: lightRadius,
    label: label
  };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = Inventory;

/* ==== src/js/target.js (rule) ==== */
/* STRATA — GNU GPL v2. 条文は LICENSE、由来は NOTICE.md。 */
/* target.js — 注視と目標指定。docs/09 §9.4 ([[D-49]])。DOM 非依存。
 *
 * M2 の最大の穴: 遠隔攻撃と能力を実装したのに「どれを狙うか」が
 * プレイヤーの手に無かった。群れの中の1体を狙う選択が成立していなかった。
 *
 * ルール層に置くので、目標選択のロジックもヘッドレスでテストできる。
 */
'use strict';

var Target = (function () {

  /** 注視モードの状態。W に持たせる(セーブ対象外の一時状態)。 */
  function createCursor(W) {
    return { x: W.player.x, y: W.player.y, index: -1 };
  }

  /**
   * 注視の対象になりうるものを近い順に並べる。
   * 見えている敵 → 見えているアイテム → の順。
   */
  function candidates(W) {
    var p = W.player, lv = W.level, out = [];
    var i;

    for (i = 0; i < W.actors.length; i++) {
      var a = W.actors[i];
      if (a.dead || a.kind === 'player') continue;
      if (!World.hasFlag(lv, a.x, a.y, World.F.VISIBLE) && !a.detected) continue;
      out.push({ kind: 'monster', actor: a, x: a.x, y: a.y,
                 dist: U.distCheb(a.x, a.y, p.x, p.y) });
    }
    for (i = 0; i < W.items.length; i++) {
      var it = W.items[i];
      if (!World.hasFlag(lv, it.x, it.y, World.F.VISIBLE)) continue;
      out.push({ kind: 'item', item: it, x: it.x, y: it.y,
                 dist: U.distCheb(it.x, it.y, p.x, p.y) });
    }

    // 敵を先に、それぞれ近い順。同距離なら座標順(決定論を保つ)。
    out.sort(function (a, b) {
      if (a.kind !== b.kind) return a.kind === 'monster' ? -1 : 1;
      if (a.dist !== b.dist) return a.dist - b.dist;
      return (a.y - b.y) || (a.x - b.x);
    });
    return out;
  }

  /** 次の候補へカーソルを送る。候補が無ければ null。 */
  function cycle(W, cursor, dir) {
    var list = candidates(W);
    if (list.length === 0) return null;
    var n = list.length;
    cursor.index = ((cursor.index + (dir || 1)) % n + n) % n;
    var c = list[cursor.index];
    cursor.x = c.x; cursor.y = c.y;
    return c;
  }

  /** カーソルを自由に動かす。マップ内に留める。 */
  function move(W, cursor, dx, dy) {
    var lv = W.level;
    cursor.x = U.clamp(cursor.x + dx, 0, lv.w - 1);
    cursor.y = U.clamp(cursor.y + dy, 0, lv.h - 1);
    cursor.index = -1;          // 自由移動したら候補の巡回から外れる
    return at(W, cursor.x, cursor.y);
  }

  /** その座標にあるものを返す。 */
  function at(W, x, y) {
    var a = World.actorAt(W, x, y);
    if (a && a.kind !== 'player' &&
        (World.hasFlag(W.level, x, y, World.F.VISIBLE) || a.detected)) {
      return { kind: 'monster', actor: a, x: x, y: y };
    }
    var items = Item.itemsAt(W, x, y);
    if (items.length && World.hasFlag(W.level, x, y, World.F.KNOWN)) {
      return { kind: 'item', item: items[0], x: x, y: y };
    }
    if (World.hasFlag(W.level, x, y, World.F.KNOWN)) {
      return { kind: 'tile', tile: World.getTile(W.level, x, y), x: x, y: y };
    }
    return { kind: 'unknown', x: x, y: y };
  }

  /* ---------- 目標の記憶 ---------- */

  /**
   * 目標を設定する。以後 f(撃つ) と m(能力) がこれを使う。
   * @param what candidates() / at() が返した対象
   */
  function set(W, what) {
    if (!what || what.kind !== 'monster') { W.target = null; return false; }
    W.target = { id: what.actor.id };
    return true;
  }

  function clear(W) { W.target = null; }

  /**
   * 記憶した目標を解決する。
   * 死んだ / 見えなくなった / 階が変わった 場合は自動で解除する。
   */
  function resolve(W) {
    if (!W.target) return null;
    for (var i = 0; i < W.actors.length; i++) {
      var a = W.actors[i];
      if (a.id !== W.target.id) continue;
      if (a.dead) break;
      if (!World.hasFlag(W.level, a.x, a.y, World.F.VISIBLE) && !a.detected) break;
      return a;
    }
    W.target = null;
    return null;
  }

  /**
   * 攻撃/能力が狙う相手。目標が有効ならそれ、無ければ最も近い敵。
   * これで「目標を指定しなければ従来通り」が保たれる。
   */
  function pick(W) {
    return resolve(W) || Effect.nearestVisible(W, W.player);
  }

  /* ---------- 説明文 ---------- */

  /** カーソル下のものの説明。知っていることだけを出す。 */
  function describe(W, what) {
    if (!what) return ['(何もない)'];
    if (what.kind === 'monster') {
      var a = what.actor;
      var lines = [a.name];
      var e = W.lore[a.raceId];
      lines.push('  距離 ' + U.distCheb(a.x, a.y, W.player.x, W.player.y) +
                 (a.asleep > 0 ? '  眠っている' : ''));
      if (e && Lore.knowsHP(W, a.raceId)) {
        lines.push('  体力 およそ ' + Math.round(a.hpMax) + '  防御 ' + a.ac);
        lines.push('  速度 ' + Turn.speedLabel(a.speed));
      } else {
        lines.push('  体力 不明');
      }
      var ratio = a.hp / a.hpMax;
      lines.push('  ' + (ratio > 0.75 ? '無傷' : ratio > 0.4 ? '傷ついている' :
                         ratio > 0.15 ? '深手を負っている' : '瀕死'));
      return lines;
    }
    if (what.kind === 'item') {
      return [Inventory.label(what.item, W.knowledge)];
    }
    if (what.kind === 'tile') {
      return [World.TILE_INFO[what.tile].name];
    }
    return ['(未探索)'];
  }

  return {
    createCursor: createCursor, candidates: candidates,
    cycle: cycle, move: move, at: at,
    set: set, clear: clear, resolve: resolve, pick: pick,
    describe: describe
  };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = Target;

/* STRATA — GNU GPL v2. 条文は LICENSE、由来は NOTICE.md。 */
/* hub.js — 母船《アンカー》。交易区・格納庫・降下。docs/03 §3.6。DOM 非依存。
 *
 * 深度0 の固定マップとして表現する ([[D-39]])。町を特別扱いしないので、
 * 移動・描画・セーブの仕組みがそのまま使える。
 */
'use strict';

var Hub = (function () {

  /* 交易区6区画 (docs/03 §3.6)。bases が扱う品目。 */
  var SHOPS = [
    { id: 'supply',  name: '補給所', glyph: '1', bases: ['ration', 'cell', 'ampule'], depthBias: 0 },
    { id: 'arms',    name: '兵装廠', glyph: '2', bases: ['weapon', 'launcher', 'ammo'], depthBias: 0 },
    { id: 'armour',  name: '装甲廠', glyph: '3', bases: ['suit', 'plate'], depthBias: 0 },
    { id: 'chem',    name: '調剤室', glyph: '4', bases: ['ampule'], depthBias: 2 },
    { id: 'info',    name: '情報屋', glyph: '5', bases: ['protocol'], depthBias: 2, services: ['analyze', 'cure'] },
    { id: 'works',   name: '工房',   glyph: '6', bases: ['implant', 'neurallink', 'light'], depthBias: 4, services: ['repair', 'transplant'] }
  ];

  var MAP_W = 60, MAP_H = 24;

  /**
   * 母船の階層を作る。固定レイアウトなので毎回同じ。
   * 中央に降下ポッド、周囲に交易区6区画と格納庫。
   */
  function createLevel() {
    var lv = World.createLevel(MAP_W, MAP_H);
    lv.depth = 0;
    lv.isHub = true;

    // 全体を床にして外周を壁で囲む
    for (var y = 1; y < MAP_H - 1; y++) {
      for (var x = 1; x < MAP_W - 1; x++) {
        World.setTile(lv, x, y, World.TILE.FLOOR);
        World.addFlag(lv, x, y, World.F.GLOW | World.F.KNOWN);
      }
    }

    // 交易区は上下に3つずつ。入口タイルを置く。
    lv.shopDoors = {};
    for (var i = 0; i < SHOPS.length; i++) {
      var col = 8 + (i % 3) * 18;
      var row = (i < 3) ? 4 : MAP_H - 5;
      buildStall(lv, col, row, SHOPS[i]);
      lv.shopDoors[col + ',' + row] = SHOPS[i].id;
    }

    // 中央に降下ポッド
    var cx = MAP_W >> 1, cy = MAP_H >> 1;
    World.setTile(lv, cx, cy, World.TILE.DOWN);
    lv.down = { x: cx, y: cy };
    lv.up = { x: cx, y: cy };          // 母船が最上位。上には行けない

    // 格納庫(倉庫)
    lv.homeAt = { x: cx - 6, y: cy };
    World.setTile(lv, lv.homeAt.x, lv.homeAt.y, World.TILE.SHOP);
    lv.shopDoors[lv.homeAt.x + ',' + lv.homeAt.y] = 'home';

    lv.rooms = [{ x1: 1, y1: 1, x2: MAP_W - 2, y2: MAP_H - 2 }];
    return lv;
  }

  /** 店の区画。3x3 の箱に入口を1つ。 */
  function buildStall(lv, cx, cy, shop) {
    for (var y = cy - 1; y <= cy + 1; y++) {
      for (var x = cx - 2; x <= cx + 2; x++) World.setTile(lv, x, y, World.TILE.WALL);
    }
    World.setTile(lv, cx, cy, World.TILE.SHOP);
  }

  function shopById(id) {
    for (var i = 0; i < SHOPS.length; i++) if (SHOPS[i].id === id) return SHOPS[i];
    return null;
  }

  /** その座標に店があれば id を返す。 */
  function shopAt(lv, x, y) {
    if (!lv.shopDoors) return null;
    return lv.shopDoors[x + ',' + y] || null;
  }

  /* ---------- 在庫 ---------- */

  /**
   * 在庫を作り直す。到達最深度に応じて品揃えが伸びる (docs/02 §2.8)。
   * 母船に戻るたびに一定確率で入れ替わる。
   */
  function restock(W, force) {
    if (!W.shops) W.shops = {};
    var depth = Math.max(1, W.player.depthMax);

    for (var i = 0; i < SHOPS.length; i++) {
      var s = SHOPS[i];
      if (!force && W.shops[s.id] && !W.rng.oneIn(3)) continue;

      var rng = W.rng.derive('shop/' + s.id + '/' + W.turn);
      var stock = [];
      var n = 6 + rng.int(6);
      for (var k = 0; k < n; k++) {
        var pool = Data.get().items.filter(function (it) {
          return s.bases.indexOf(it.base) !== -1;
        });
        var kind = Data.allocate(rng, pool, Math.min(100, depth + s.depthBias));
        if (!kind) continue;
        var it = Item.create(rng, kind, 1);
        if (it.stackable) it.count = rng.range(2, 8);
        // 店売り品は解析済み。値段が付くものしか置けないため。
        it.known = true;
        Sigil.learnKind(W, it.kindId);
        stock.push(it);
      }
      W.shops[s.id] = stock;
    }
  }

  /* ---------- 価格 ---------- */

  /** 統率で買値が下がる。本家の CHR と同じ役割。 */
  function priceFactor(p) {
    var chr = Stat.effective(p, 'chr');
    return 1.4 - Math.min(0.5, Stat.index(chr) * 0.012);
  }

  /** 買値は**1個あたり**。購入は1個ずつなので、表示と実際を一致させる。 */
  function buyPrice(W, it) {
    return Math.max(1, Math.round(unitValue(W, it) * priceFactor(W.player)));
  }

  /** 売値は買値よりずっと安い。稼ぎ手段にしない。持っている数ぶんまとめて売る。 */
  function sellPrice(W, it) {
    return Math.max(1, Math.round(unitValue(W, it) * (it.count || 1) * 0.25));
  }

  /** アイテム1個あたりの価値。刻印の価値を合算する。 */
  function unitValue(W, it) {
    var v = it.cost || 1;
    var db = Data.get();
    for (var i = 0; i < (it.sigils || []).length; i++) {
      var s = db.sigilsById[it.sigils[i]];
      if (s) v += s.value * Math.max(1, it.pval || 1);
    }
    v += (it.toHit || 0) * 30 + (it.toDam || 0) * 40 + (it.ac || 0) * 25;
    return Math.max(1, Math.round(v));
  }

  /** 山全体の価値。解析費用の算定などに使う。 */
  function valueOf(W, it) { return unitValue(W, it) * (it.count || 1); }

  function buy(W, shopId, index) {
    var stock = W.shops[shopId];
    if (!stock || !stock[index]) return { ok: false, reason: 'その品は無い。' };
    var it = stock[index];
    var price = buyPrice(W, it);
    if (W.inv.credits < price) return { ok: false, reason: 'クレジットが足りない。' };

    var copy = JSON.parse(JSON.stringify(it));
    copy.uid = Item.nextUid();
    if (copy.stackable) copy.count = 1;
    if (!Inventory.add(W.inv, copy)) return { ok: false, reason: '所持品がいっぱいだ。' };

    W.inv.credits -= price;
    if (it.stackable && it.count > 1) it.count--;
    else stock.splice(index, 1);
    return { ok: true, item: copy, price: price };
  }

  function sell(W, shopId, it) {
    var shop = shopById(shopId);
    if (!shop) return { ok: false, reason: 'ここでは買い取らない。' };
    if (shop.bases.indexOf(it.base) === -1) return { ok: false, reason: 'ここでは扱っていない。' };

    var price = sellPrice(W, it);
    Inventory.remove(W.inv, it);
    W.inv.credits += price;
    // 売った品は解析される = 知識になる
    Sigil.analyze(W, it);
    return { ok: true, price: price };
  }

  /* ---------- 役務 ---------- */

  function analyzeService(W, it) {
    var price = 120 + Math.round(valueOf(W, it) * 0.05);
    if (W.inv.credits < price) return { ok: false, reason: 'クレジットが足りない。' };
    W.inv.credits -= price;
    Sigil.analyze(W, it);
    it.known = true;
    return { ok: true, price: price };
  }

  function cureService(W) {
    var price = 200;
    if (W.inv.credits < price) return { ok: false, reason: 'クレジットが足りない。' };
    W.inv.credits -= price;
    Stat.restore(W.player);
    W.player.exposure = 0;
    W.player.timers.poison = 0;
    return { ok: true, price: price };
  }

  function repairService(W) {
    var damaged = Inventory.SLOTS.map(function (s) { return W.inv.equip[s]; })
      .filter(function (e) { return e && e.damaged; });
    if (damaged.length === 0) return { ok: false, reason: '損傷している装備が無い。' };
    var total = 0;
    for (var i = 0; i < damaged.length; i++) total += damaged[i].damaged * 40;
    if (W.inv.credits < total) return { ok: false, reason: 'クレジットが足りない。' };
    W.inv.credits -= total;
    for (var j = 0; j < damaged.length; j++) {
      damaged[j].ac += damaged[j].damaged;
      damaged[j].damaged = 0;
    }
    return { ok: true, price: total, count: damaged.length };
  }

  /* ---------- 格納庫 ---------- */

  var HOME_MAX = 24;

  function store(W, it) {
    if (W.home.length >= HOME_MAX) return { ok: false, reason: '格納庫がいっぱいだ。' };
    Inventory.remove(W.inv, it);
    W.home.push(it);
    return { ok: true };
  }

  function retrieve(W, index) {
    var it = W.home[index];
    if (!it) return { ok: false, reason: 'その品は無い。' };
    if (!Inventory.add(W.inv, it)) return { ok: false, reason: '所持品がいっぱいだ。' };
    W.home.splice(index, 1);
    return { ok: true, item: it };
  }

  return {
    SHOPS: SHOPS, MAP_W: MAP_W, MAP_H: MAP_H, HOME_MAX: HOME_MAX,
    createLevel: createLevel, shopById: shopById, shopAt: shopAt,
    restock: restock, valueOf: valueOf, unitValue: unitValue,
    buyPrice: buyPrice, sellPrice: sellPrice,
    buy: buy, sell: sell,
    analyzeService: analyzeService, cureService: cureService, repairService: repairService,
    store: store, retrieve: retrieve
  };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = Hub;

/* ==== src/js/craft.js (rule) ==== */
/* STRATA — GNU GPL v2. 条文は LICENSE、由来は NOTICE.md。 */
/* craft.js — 解体と移植。docs/11 §11.4 ([[doc:concept]] §0.4(4))。DOM 非依存。
 *
 * 本家は「エゴ品/固有品は拾うもの」。本作は**拾ったジャンクを解体・移植**できる。
 *
 * 狙いは「弱いが好きな装備を育てられる」ことであって、
 * 最強装備を組み立てる工房ではない。だから:
 *
 *   - 素の装備からは何も取れない。**改修品(エゴ)を解体したときだけ**刻印が取れる
 *     → 今まで売るしかなかった「弱いエゴ品」に価値が生まれる
 *   - 移植は**2枠まで**。全部載せが最適解になると選択が消える
 *   - 移植は失敗しない。**緊張は素材の希少さで作る**
 */
'use strict';

var Craft = (function () {

  /** 1つの装備に移植できるモジュールの数 (docs/11 §11.4)。 */
  var MAX_MODULES = 2;

  /** モジュールの表示名。語彙は刻印と同じものを使う (新しい語を増やさない)。 */
  function sigilLabel(id) {
    var s = Data.get().sigilsById[id];
    return s ? s.name : id;
  }

  /* ---------- 解体 ---------- */

  /** 解体して何が取れるか。取れないなら null。 */
  function salvageYield(it) {
    if (!it || !it.slot) return null;                 // 装備でないものは解体しない
    if (it.uniqueId) return null;                     // 固有機材は壊させない
    var sigils = (it.sigils || []).filter(function (s) { return s.charAt(0) === 's'; });
    if (!it.egoId || !sigils.length) return null;     // 素の装備からは取れない
    return sigils[0];
  }

  /** 解体できない理由。できるなら null。 */
  function salvageReason(W, it) {
    if (!it) return 'その品は無い。';
    if (!it.slot) return '装備品でないものは解体できない。';
    if (it.uniqueId) return 'これは分解できない。';
    if (!it.known) return '解析していないものは解体できない。';
    if (!salvageYield(it)) return '取り出せるものが無い。改修品でないと何も残らない。';
    return null;
  }

  /**
   * 解体する。装備は**戻らない**。
   * @returns {object} { ok, sigil, reason }
   */
  function salvage(W, it) {
    var why = salvageReason(W, it);
    if (why) return { ok: false, reason: why };

    var sig = salvageYield(it);
    Inventory.remove(W.inv, it);
    addModule(W, sig);
    World.msg(W, Sigil.name(W.knowledge, it) + 'を解体した。');
    World.msg(W, '《' + sigilLabel(sig) + '》のモジュールを取り出した。');
    return { ok: true, sigil: sig };
  }

  /* ---------- モジュールの手持ち ---------- */

  function modules(W) {
    if (!W.modules) W.modules = {};
    return W.modules;
  }

  function addModule(W, sigilId) {
    var m = modules(W);
    m[sigilId] = (m[sigilId] || 0) + 1;
  }

  function moduleList(W) {
    var m = modules(W), out = [];
    for (var k in m) if (m[k] > 0) out.push({ sigil: k, count: m[k] });
    out.sort(function (a, b) { return a.sigil < b.sigil ? -1 : 1; });
    return out;
  }

  /* ---------- 移植 ---------- */

  /**
   * 移植に要るレアパーツの数 (docs/11 §11.4)。
   * 深いほど高くつく。供給過多にしないための制約。
   */
  function partsNeeded(W, it) {
    var depth = Math.max(1, W.player.depthMax);
    return 1 + Math.floor(depth / 25);
  }

  function parts(W) { return W.parts || 0; }

  function addParts(W, n) { W.parts = parts(W) + n; }

  /** 移植できない理由。できるなら null。 */
  function transplantReason(W, it, sigilId) {
    if (!it) return 'その品は無い。';
    if (!it.slot) return '装備品にしか移植できない。';
    if (it.uniqueId) return '固有機材には手を入れられない。';
    if (!it.known) return '解析していないものには移植できない。';
    if (!modules(W)[sigilId]) return 'そのモジュールを持っていない。';
    if ((it.sigils || []).indexOf(sigilId) !== -1) return '既に同じ刻印が入っている。';
    if (grafted(it) >= MAX_MODULES) {
      return 'これ以上は入らない。(' + MAX_MODULES + '枠まで)';
    }
    if (parts(W) < partsNeeded(W, it)) {
      return 'レアパーツが足りない。(' + parts(W) + '/' + partsNeeded(W, it) + ')';
    }
    return null;
  }

  /** その装備に移植済みのモジュール数。元から付いていた刻印は数えない。 */
  function grafted(it) { return (it.grafted || []).length; }

  /**
   * 移植する。**失敗しない。**
   * @returns {object} { ok, reason }
   */
  function transplant(W, it, sigilId) {
    var why = transplantReason(W, it, sigilId);
    if (why) return { ok: false, reason: why };

    var need = partsNeeded(W, it);
    W.parts = parts(W) - need;
    modules(W)[sigilId]--;

    if (!it.sigils) it.sigils = [];
    it.sigils.push(sigilId);
    if (!it.grafted) it.grafted = [];
    it.grafted.push(sigilId);

    // 移植した装備は改修品として扱う。名前にもそれが出る
    if (!it.egoId) {
      it.egoId = 'e-grafted';
      it.egoName = '改造';
    }
    Sigil.learnSigil(W, sigilId);
    World.msg(W, Sigil.name(W.knowledge, it) + 'に《' + sigilLabel(sigilId) + '》を移植した。');
    return { ok: true };
  }

  return {
    MAX_MODULES: MAX_MODULES, sigilLabel: sigilLabel,
    salvageYield: salvageYield, salvageReason: salvageReason, salvage: salvage,
    modules: modules, addModule: addModule, moduleList: moduleList,
    partsNeeded: partsNeeded, parts: parts, addParts: addParts,
    transplantReason: transplantReason, transplant: transplant, grafted: grafted
  };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = Craft;

/* ==== src/js/signature.js (rule) ==== */
/* STRATA — GNU GPL v2. 条文は LICENSE、由来は NOTICE.md。 */
/* signature.js — サイト固有の機構。docs/08 §8.5-8.6, docs/10 §10.2。DOM 非依存。
 *
 * 「同じ深度・同じ装備でも、サイトが変われば次の一手が変わるか」が
 * 差別化の判定基準 (docs/10 §10.1)。ここがその答えを作る。
 *
 *   方舟 pressure     … 区画ごとの気圧。扉を開けると均される ([[D-47]])
 *   灰   daynight     … 昼夜で環境光・温度・放射線・敵が変わる
 *   尖塔 surveillance … 監視に補足されると増援が湧き続ける
 *   遺跡 dark         … 環境光0。env だけで成立するのでここでは何もしない
 */
'use strict';

var Signature = (function () {

  /* ---------- 入階時の仕込み ---------- */

  function onEnter(W) {
    var sig = W.site && W.site.signature;
    if (sig === 'pressure') initPressure(W);
    else if (sig === 'daynight') applyDayNight(W, true);
    else if (sig === 'surveillance') initSurveillance(W);
  }

  /* ================= 方舟: 区画ごとの気圧 ([[D-47]]) ================= */

  /**
   * 部屋ごとに気圧を割り振る。通路は低圧。
   * 敵は扉を開けないので、**気圧を操作できるのはプレイヤーだけ**。
   * この非対称性が「扉を開けるか」という選択を生む (docs/10 §10.2)。
   */
  /* 破断の割合は深度で変わる。浅い層はまだ与圧が生きていて、
     深部ほど船が壊れている。物語としても自然で、難易度曲線も素直になる。
     深度1 の時点で通路が真空だと、初期装備(気密1)では一歩も動けない ([[D-61]])。 */
  /** サイト内の進行度 0(最浅) 〜 1(最深)。 */
  function siteT(site, depth) {
    var span = Math.max(1, site.depthMax - site.depthMin);
    return U.clamp((depth - site.depthMin) / span, 0, 1);
  }

  function breachRate(site, depth) {
    return 0.10 + siteT(site, depth) * 0.75;         // 10% → 85%
  }

  /**
   * 破断した区画の気圧。**破断の割合だけでなく深さも深度で変える**。
   * 浅い層の破断を即座に真空(必要気密4)にすると、気密4の装甲スーツが
   * 買える深度10 まで一歩も入れない区画が生まれる。
   * 45 → 10 と落とすことで、必要気密が 1 → 4 と段階的に上がり、
   * 作業スーツ(深度1) → 真空作業服(深度4) → 装甲スーツ(深度10)
   * という装備の階段と噛み合う ([[D-62]])。
   */
  function breachAir(site, depth) {
    return Math.round(45 - siteT(site, depth) * 35);  // 45 → 10
  }

  function initPressure(W) {
    var lv = W.level;
    var rng = W.rng.derive('pressure/' + W.depth);
    lv.pressure = new Uint8Array(lv.w * lv.h);

    var rate = breachRate(W.site, W.depth);
    var SEALED = 75;                                 // 与圧されている = 呼吸できる
    var BREACH = breachAir(W.site, W.depth);

    /* 通路は深度が浅いうちは与圧されている。
       深部では通路から破断していく(区画だけが島のように残る)。 */
    var hallSealed = rng.float() > rate;
    for (var i = 0; i < lv.pressure.length; i++) {
      lv.pressure[i] = hallSealed ? SEALED : BREACH;
    }

    // 部屋ごとに破断しているかを決める
    for (var r = 0; r < lv.rooms.length; r++) {
      var room = lv.rooms[r];
      var p = rng.float() < rate ? BREACH : SEALED;
      for (var y = room.y1; y <= room.y2; y++) {
        for (var x = room.x1; x <= room.x2; x++) {
          if (!World.inBounds(lv, x, y)) continue;
          lv.pressure[y * lv.w + x] = p;
        }
      }
    }

    // 入った場所と階段は必ず生存可能にする(入った瞬間に死なせない)
    floodPressure(lv, W.player.x, W.player.y, SEALED);
  }

  /** その座標の気圧。区画気圧が無いサイトではサイトの既定値。 */
  function pressureAt(W, x, y) {
    var lv = W.level;
    if (!lv.pressure) return Env.envOf(W).atmosphere;
    if (!World.inBounds(lv, x, y)) return 0;
    return lv.pressure[y * lv.w + x];
  }

  /** 連結する区画を同じ気圧で塗る(扉は越えない)。 */
  function floodPressure(lv, sx, sy, value) {
    if (!lv.pressure || !World.walkable(lv, sx, sy)) return 0;
    var seen = new Uint8Array(lv.w * lv.h);
    var stack = [sy * lv.w + sx];
    seen[sy * lv.w + sx] = 1;
    var n = 0;
    while (stack.length) {
      var cur = stack.pop();
      var cx = cur % lv.w, cy = (cur - cx) / lv.w;
      lv.pressure[cur] = value;
      n++;
      if (World.getTile(lv, cx, cy) === World.TILE.DOOR) continue;  // 扉で止まる
      for (var d = 0; d < U.ORTHO.length; d++) {
        var nx = cx + U.ORTHO[d].dx, ny = cy + U.ORTHO[d].dy;
        if (!World.walkable(lv, nx, ny)) continue;
        var ni = ny * lv.w + nx;
        if (seen[ni]) continue;
        seen[ni] = 1;
        stack.push(ni);
      }
    }
    return n;
  }

  /**
   * 扉を通ったときに気圧を均す。
   * 高圧側から低圧側へ抜けると突風が起き、アクターが押し流される。
   * @returns {object|null} { from, to, gust } 起きたことの記録
   */
  function equalize(W, doorX, doorY, fromX, fromY, toX, toY) {
    var lv = W.level;
    if (!lv.pressure) return null;

    var a = pressureAt(W, fromX, fromY);
    var b = pressureAt(W, toX, toY);
    if (Math.abs(a - b) < 10) return null;          // 差が小さければ何も起きない

    // 均した値。体積を考えず単純な平均にする(挙動が読めることを優先)
    var mid = Math.round((a + b) / 2);
    World.setTile(lv, doorX, doorY, World.TILE.FLOOR);   // 扉は開いたまま
    floodPressure(lv, fromX, fromY, mid);
    floodPressure(lv, toX, toY, mid);

    var diff = Math.abs(a - b);
    var gust = diff >= 40;
    if (gust) {
      World.msg(W, '隔壁が開き、空気が一気に流れ込んだ。');
      blowActors(W, toX, toY, a > b ? 1 : -1, fromX, fromY);
    } else {
      World.msg(W, '気圧が均された。');
    }
    return { from: a, to: b, gust: gust };
  }

  /** 突風。扉の周囲のアクターを風下へ1マス押し流す。 */
  function blowActors(W, cx, cy, dir, fromX, fromY) {
    var dx = U.clamp(cx - fromX, -1, 1) * dir;
    var dy = U.clamp(cy - fromY, -1, 1) * dir;
    if (!dx && !dy) return;

    for (var i = 0; i < W.actors.length; i++) {
      var a = W.actors[i];
      if (a.dead) continue;
      if (U.distCheb(a.x, a.y, cx, cy) > 2) continue;
      var nx = a.x + dx, ny = a.y + dy;
      if (!World.walkable(W.level, nx, ny)) continue;
      if (World.actorAt(W, nx, ny)) continue;
      a.x = nx; a.y = ny;
      if (a.kind === 'monster') a.asleep = 0;        // 起きる
      if (a.kind === 'player') World.msg(W, '突風に押し流された。');
    }
  }

  /* ================= 灰の地表: 昼夜 ================= */

  var DAY_LENGTH = 1000;      // ゲームターン。半分が昼、半分が夜

  function isNight(W) {
    return Math.floor(W.turn / (DAY_LENGTH / 2)) % 2 === 1;
  }

  /** 昼夜を環境に反映する。@param force 入階時は必ず適用 */
  function applyDayNight(W, force) {
    var night = isNight(W);
    if (!force && W.level.night === night) return false;

    var base = W.site.env;
    W.level.night = night;
    W.level.env.ambient = night ? 0 : base.ambient;
    W.level.env.temperature = base.temperature + (night ? -50 : 30);
    W.level.env.radiation = night ? Math.max(0, base.radiation - 4) : base.radiation + 3;

    if (!force) {
      World.msg(W, night ? '陽が落ちた。灰が冷えていく。'
                         : '夜が明けた。恒星風が地表を舐めはじめる。');
    }
    return true;
  }

  /* ================= 尖塔: 監視と増援 ================= */

  function initSurveillance(W) {
    W.alerted = false;
    W.alertLevel = 0;
    W.reinforceAt = 0;
  }

  /**
   * 監視に補足されるか。隠密が高いほど見つかりにくい。
   * 補足されると**増援が湧き続ける**ので、戦って解決できない。
   */
  function checkSurveillance(W) {
    var env = Env.envOf(W);
    if (env.surveillance <= 0) return;
    if (Site.hasAdaptation(W, 'watch')) return;      // 《適合:監視》で無効化
    if (Net.isBlinded(W)) return;                    // 走査系を止めている (docs/11 §11.3)

    var p = W.player;
    if (!W.alerted) {
      // 隠密が高いほど見つかりにくい。明かりを消していれば更に。
      var stealth = (p.skills && p.skills.stealth) || 0;
      var risk = env.surveillance * 2 - stealth;
      if (p.lightOff) risk -= 6;
      if (risk > 0 && W.rng.int(1000) < risk) {
        W.alerted = true;
        W.alertLevel = 1;
        W.reinforceAt = W.turn + 60;
        World.msg(W, '監視網に補足された。増援が来る。');
      }
      return;
    }

    // 補足中は定期的に増援。時間が経つほど濃くなる。
    if (W.turn >= W.reinforceAt) {
      spawnReinforcement(W);
      W.alertLevel++;
      W.reinforceAt = W.turn + Math.max(40, 120 - W.alertLevel * 10);
    }
  }

  function spawnReinforcement(W) {
    var rng = W.rng.derive('reinforce/' + W.turn);
    var n = Math.min(3, 1 + Math.floor(W.alertLevel / 3));
    var made = 0;
    for (var i = 0; i < n; i++) {
      var race = Monster.pickNormal(rng, W, W.depth, W.site);
      if (!race) continue;
      var spot = Monster.findSpawnSpot(rng, W, 8);
      if (!spot) continue;
      var mon = Monster.spawn(rng, race, spot.x, spot.y);
      mon.asleep = 0;                                // 呼ばれて来たので起きている
      World.addActor(W, mon);
      made++;
    }
    if (made) World.msg(W, '増援が到着した。');
  }

  /** 補足を解除する手段。監視装置を壊すか、階を移る。 */
  function clearAlert(W) {
    if (!W.alerted) return false;
    W.alerted = false;
    W.alertLevel = 0;
    World.msg(W, '監視網から外れた。');
    return true;
  }

  /* ---------- 毎ゲームターン ---------- */

  function tick(W) {
    var sig = W.site && W.site.signature;
    if (sig === 'daynight') applyDayNight(W, false);
    else if (sig === 'surveillance') checkSurveillance(W);

    // 方舟: 立っている区画の気圧を環境に反映する
    if (sig === 'pressure' && W.level.pressure) {
      W.level.env.atmosphere = pressureAt(W, W.player.x, W.player.y);
    }
  }

  return {
    onEnter: onEnter, tick: tick,
    initPressure: initPressure, pressureAt: pressureAt,
    breachRate: breachRate, breachAir: breachAir, siteT: siteT,
    floodPressure: floodPressure, equalize: equalize, blowActors: blowActors,
    DAY_LENGTH: DAY_LENGTH, isNight: isNight, applyDayNight: applyDayNight,
    initSurveillance: initSurveillance, checkSurveillance: checkSurveillance,
    spawnReinforcement: spawnReinforcement, clearAlert: clearAlert
  };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = Signature;

/* ==== src/js/net.js (rule) ==== */
/* STRATA — GNU GPL v2. 条文は LICENSE、由来は NOTICE.md。 */
/* net.js — 電脳層(縮小版)。docs/11 §11.1-11.3。DOM 非依存。
 *
 * 第2マップは作らない ([[D-65]])。狙いは一点だけ:
 *   **ネット面での行動が物理面に反映される。**
 *
 * 端末の上で接続し、認知(Cognition)を払って階そのものに干渉する。
 * ICE は敵ではなく**難度**として表す。
 *
 * 端末は安全な場所ではない。認知が尽きれば昏倒し、
 * **物理面の肉体が無防備になる** ―― ジャックインは常に「今ここで背中を晒す」判断。
 */
'use strict';

var Net = (function () {

  function ops() { return Data.get().netops; }
  function byId(id) { return Data.get().netopsById[id]; }

  /** 端末の上に立っているか。 */
  function atTerminal(W) {
    return World.getTile(W.level, W.player.x, W.player.y) === World.TILE.TERM;
  }

  /** この階でその操作が使えるか。使えない理由を返す(使えるなら null)。 */
  function blockReason(W, op) {
    var siteId = W.site ? W.site.id : null;
    if (op.sites && op.sites.indexOf(siteId) === -1) {
      return 'この設備には該当する系統が無い。';
    }
    if (W.netDone && W.netDone[op.id]) {
      return '既に通してある。もう変わらない。';
    }
    return null;
  }

  /** この階で使える操作の一覧(使えないものも理由付きで含める)。 */
  function listFor(W) {
    var all = ops();
    var out = [];
    for (var i = 0; i < all.length; i++) {
      out.push({ op: all[i], blocked: blockReason(W, all[i]) });
    }
    return out;
  }

  /* ---------- ICE ---------- */

  /**
   * ICE 難度。深度で上がる。
   * 深度/3 では技能の伸びに追い越され、専門家の成功率が上限に張り付いた。
   * **深部では専門家でも確実ではない**ようにする ([[D-74]])。
   */
  function difficulty(W, op) {
    return op.ice + Math.floor(W.depth / 2);
  }

  /** 成功率(%)。接続技能がそのまま効く。 */
  function chance(W, op) {
    var skill = (W.player.skills && W.player.skills.net) || 0;
    return U.clamp(55 + skill - difficulty(W, op), 5, 95);
  }

  /* ---------- 接続 ---------- */

  /**
   * 接続して1つ通す。
   * @returns {object} { ok, reason, roll, dealt } dealt は消費した認知
   */
  function jack(W, opId) {
    var p = W.player;
    if (!atTerminal(W)) return { ok: false, reason: 'ここに端末は無い。' };

    var op = byId(opId);
    if (!op) return { ok: false, reason: 'そのような操作は無い。' };

    var blocked = blockReason(W, op);
    if (blocked) return { ok: false, reason: blocked };

    if (p.cog < op.cost) {
      return { ok: false, reason: '認知が足りない。(' + p.cog + '/' + op.cost + ')' };
    }

    spend(W, op.cost);
    var pct = chance(W, op);
    var roll = W.rng.int(100);
    World.msg(W, '接続した。' + op.name + '。');

    if (roll < pct) {
      run(W, op);
      if (!W.netDone) W.netDone = {};
      W.netDone[op.id] = true;
      return { ok: true, roll: roll, dealt: op.cost };
    }

    // 失敗。操作は起きない。認知を余分に持っていかれる。
    spend(W, op.fail);
    World.msg(W, 'ICE に弾かれた。');
    traced(W, roll, pct);
    return { ok: false, reason: 'ICE に弾かれた。', roll: roll, dealt: op.cost + op.fail };
  }

  /**
   * 認知を削る。0 になると昏倒する ([[doc:concept]] §0.4(3))。
   * HP ではなく認知を削るのが電脳層の定義そのもの。
   */
  function spend(W, amount) {
    var p = W.player;
    p.cog = Math.max(0, p.cog - amount);
    if (p.cog > 0) return;

    World.msg(W, '意識が飛んだ。');
    Actor.addTimer(p, 'paralyzed', W.rng.range(3, 6));
  }

  /** 大きく失敗すると逆探知される。監視のあるサイトでは補足に繋がる。 */
  function traced(W, roll, pct) {
    if (roll < pct + 25) return;                 // 惜しい失敗では起きない
    var env = Env.envOf(W);
    if (!env || env.surveillance <= 0) return;
    if (Site.hasAdaptation(W, 'watch')) return;
    if (W.alerted) return;
    W.alerted = true;
    W.alertLevel = 1;
    W.reinforceAt = W.turn + 40;
    World.msg(W, '逆探知された。位置が知られた。');
  }

  /* ---------- 物理面への反映 ---------- */

  var EFFECTS = {
    map: function (W) {
      var lv = W.level;
      for (var i = 0; i < lv.tiles.length; i++) lv.flags[i] |= World.F.KNOWN;
      World.msg(W, '階の形が頭に入った。');
    },

    manifest: function (W) {
      for (var i = 0; i < W.items.length; i++) {
        World.addFlag(W.level, W.items[i].x, W.items[i].y, World.F.KNOWN);
      }
      W.feeling.lootKnown = true;
      World.msg(W, W.items.length + ' 件の記録が残っている。');
    },

    bulkhead: function (W) {
      var lv = W.level;
      var opened = 0;
      for (var y = 0; y < lv.h; y++) {
        for (var x = 0; x < lv.w; x++) {
          if (World.getTile(lv, x, y) !== World.TILE.DOOR) continue;
          World.setTile(lv, x, y, World.TILE.FLOOR);
          opened++;
        }
      }
      World.msg(W, opened + ' 枚の隔壁が開いた。');
      // 方舟では気圧が動く。開けた側が得をするとは限らない ([[D-47]])
      if (lv.pressure) {
        Signature.floodPressure(lv, W.player.x, W.player.y,
                                Signature.pressureAt(W, W.player.x, W.player.y));
        World.msg(W, '区画をまたいで空気が動いている。');
      }
    },

    blind: function (W) {
      // これが「監視系の破壊」の実装 ([[doc:environment]] §8.3)
      Signature.clearAlert(W);
      W.netBlindUntil = W.turn + 400;
      World.msg(W, '走査系が自己診断に入った。しばらく見られていない。');
    },

    seize: function (W) {
      var n = 0;
      for (var i = 0; i < W.actors.length; i++) {
        var a = W.actors[i];
        if (a.kind !== 'monster' || a.dead) continue;
        if (a.base !== 'automata') continue;
        if (!World.hasFlag(W.level, a.x, a.y, World.F.VISIBLE)) continue;
        Actor.addTimer(a, 'paralyzed', W.rng.range(8, 16));
        n++;
      }
      World.msg(W, n ? n + ' 基が停止した。' : '応答する機械が無い。');
    }
  };

  function run(W, op) {
    var fx = EFFECTS[op.effect];
    if (fx) fx(W);
  }

  /** 監視を切っている間か。signature.js が見る。 */
  function isBlinded(W) {
    return !!(W.netBlindUntil && W.turn < W.netBlindUntil);
  }

  return {
    ops: ops, byId: byId, atTerminal: atTerminal, listFor: listFor,
    blockReason: blockReason, difficulty: difficulty, chance: chance,
    jack: jack, spend: spend, isBlinded: isBlinded, EFFECTS: EFFECTS
  };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = Net;

/* ==== src/js/origin.js (rule) ==== */
/* STRATA — GNU GPL v2. 条文は LICENSE、由来は NOTICE.md。 */
/* origin.js — 《起源》深度80〜100 の構造。docs/07 §7.4。DOM 非依存。
 *
 * 他のサイトと違い、**部分的に固定**する (docs/02 §2.3 の例外)。
 *
 *   80–89 接続層  … 4サイトの生成器を階ごとに切り替える。「どれにも似ている」
 *   90–97 中枢層  … 同じ生成器を歪ませる。地形が破綻していく
 *   98    静止層  … 固定。敵もアイテムも無い。ログ断片だけ
 *   99    《門番》 … 固定。倒すまで降下シャフトが開かない
 *   100   《起源》 … 固定。ここで終わる
 *
 * 98 で静かにさせることが 99・100 の重さを作る。
 * 本家の深度100 が唐突に始まるのに対し、ここは意図的に間を置く。
 */
'use strict';

var Origin = (function () {

  var T = World.TILE;

  function data() { return Data.get().origin; }

  /** その深度の層。《起源》以外のサイトなら null。 */
  function layerOf(depth) {
    var d = data();
    if (!d) return null;
    for (var i = 0; i < d.layers.length; i++) {
      var L = d.layers[i];
      if (depth >= L.depthMin && depth <= L.depthMax) return L;
    }
    return null;
  }

  /** その深度に固定マップがあるか。 */
  function fixedFor(depth) {
    var d = data();
    if (!d) return null;
    for (var i = 0; i < d.maps.length; i++) {
      if (d.maps[i].depth === depth) return d.maps[i];
    }
    return null;
  }

  /** 入階時に一言告げる文。層ごとに変わる。 */
  function enterText(depth) {
    var fx = fixedFor(depth);
    if (fx) return fx.enterText;
    var L = layerOf(depth);
    return L ? L.enterText : null;
  }

  /* ---------- 80〜97: 生成パラメータ ---------- */

  /**
   * 接続層は**階ごとに別のサイトの生成器**を使う。
   * 「4サイトが同じものだった」ことを、説明ではなく地形で示す (docs/07 §7.3)。
   * @returns {object} { opts, lookSite } lookSite は見た目を借りるサイト
   */
  function genFor(rng, depth) {
    var L = layerOf(depth);
    if (!L) return null;

    if (L.mixSites) {
      // 深度で決める。同じ深度なら同じサイトの顔をしている(再訪で像がブレない)
      var id = L.mixSites[depth % L.mixSites.length];
      var borrowed = Site.byId(id);
      if (borrowed) return { opts: Site.genOpts(borrowed), lookSite: borrowed };
    }
    return { opts: L.gen ? shallow(L.gen) : {}, lookSite: null };
  }

  function shallow(o) {
    var c = {};
    for (var k in o) c[k] = o[k];
    return c;
  }

  /* ---------- 98〜100: 固定マップ ---------- */

  /**
   * 固定マップから階層を作る。
   * @returns {object} { level, marks } marks は cmd.js が中身を置くのに使う
   */
  function buildFixed(rng, spec, env, W) {
    var h = spec.map.length;
    var w = 0;
    for (var i = 0; i < h; i++) w = Math.max(w, spec.map[i].length);

    // 周囲に1マス余白を付ける。端に階段が来ると視界計算が窮屈になる。
    var lv = World.createLevel(w + 2, h + 2);
    lv.depth = spec.depth;
    lv.env = env;
    lv.fixedId = spec.id;

    var marks = [];
    for (var y = 0; y < h; y++) {
      var row = spec.map[y];
      for (var x = 0; x < row.length; x++) {
        var mx = x + 1, my = y + 1;
        var ch = row[x];
        if (ch === '#') { World.setTile(lv, mx, my, T.WALL); continue; }

        World.setTile(lv, mx, my, T.FLOOR);
        World.addFlag(lv, mx, my, World.F.GLOW);

        if (ch === '<') { World.setTile(lv, mx, my, T.UP); lv.up = { x: mx, y: my }; }
        else if (ch === '>') { World.setTile(lv, mx, my, T.DOWN); lv.down = { x: mx, y: my }; }
        else if (ch === 'L') marks.push({ kind: 'lore', x: mx, y: my });
        else if (ch === 'W') marks.push({ kind: 'warden', x: mx, y: my });
        else if (ch === 'O') marks.push({ kind: 'origin', x: mx, y: my });
      }
    }

    // 部屋は1つ扱い。FOV の「明るい部屋」判定が全体に効くようにする。
    lv.rooms = [{ x1: 1, y1: 1, x2: w, y2: h, lit: true }];
    lv.marks = [];
    lv.special = [];
    lv.attempts = 1;

    /* 既に《門番》を倒しているなら、シャフトは開いたまま再生成する。
       階層は非永続なので再訪のたびに作り直されるが、
       **一度開いた道が閉じてはいけない**。 */
    if (spec.id === 'warden' && W && W.uniquesKilled && W.uniquesKilled['u-warden']) {
      marks = marks.filter(function (m) { return m.kind !== 'warden'; });
      var w0 = wardenSpot(spec);
      if (w0) {
        World.setTile(lv, w0.x, w0.y, T.DOWN);
        lv.down = { x: w0.x, y: w0.y };
      }
    }

    // 上りが無い階は作らない(入った瞬間に戻れなくなる)
    if (!lv.up) throw new Error('origin: 固定マップに昇降機が無い: ' + spec.id);
    return { level: lv, marks: marks };
  }

  /** 固定マップ上の 'W' の位置(余白1マスぶんずらした座標)。 */
  function wardenSpot(spec) {
    for (var y = 0; y < spec.map.length; y++) {
      var x = spec.map[y].indexOf('W');
      if (x !== -1) return { x: x + 1, y: y + 1 };
    }
    return null;
  }

  /**
   * 《門番》を倒した。深度100 への降下シャフトを開く。
   * 最初から開けておくと、戦わずに素通りできてしまう。
   */
  function openWardenShaft(W) {
    var lv = W.level;
    if (lv.fixedId !== 'warden' || lv.down) return false;
    // 《門番》が立っていた場所がそのまま道になる
    var x = W.wardenAt ? W.wardenAt.x : lv.up.x;
    var y = W.wardenAt ? W.wardenAt.y : lv.up.y - 1;
    if (!World.inBounds(lv, x, y)) { x = lv.up.x; y = lv.up.y; }
    World.setTile(lv, x, y, T.DOWN);
    lv.down = { x: x, y: y };
    World.msg(W, '床が落ち込み、さらに下へ続く道が開いた。');
    return true;
  }

  return {
    layerOf: layerOf, fixedFor: fixedFor, enterText: enterText,
    genFor: genFor, buildFixed: buildFixed, openWardenShaft: openWardenShaft

})();

/* ==== src/js/cmd.js (rule) ==== */
